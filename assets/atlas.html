<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas del código</title>
<style>
  :root {
    --bg:#f6f5f2; --fg:#1d1c1a; --muted:#76726b; --card:#ffffff; --line:#e1ded7; --soft:#eeece7;
    --accent:#2b59c3; --accent-soft:#e4ebfa; --code:#f2f1ec;
    --t-ui:#7c3aed; --t-ctrl:#2563eb; --t-svc:#059669; --t-repo:#c2410c; --t-ent:#be123c;
    --t-db:#0e7490; --t-cfg:#a16207; --t-otro:#8a857d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#131312; --fg:#e8e6e1; --muted:#9d988f; --card:#1c1b19; --line:#302e2b; --soft:#252421;
      --accent:#7aa2f7; --accent-soft:#1f2a44; --code:#201f1d;
      --t-ui:#a78bfa; --t-ctrl:#60a5fa; --t-svc:#34d399; --t-repo:#fb923c; --t-ent:#fb7185;
      --t-db:#22d3ee; --t-cfg:#facc15; --t-otro:#a8a29e;
    }
  }
  :root[data-theme="dark"] {
    --bg:#131312; --fg:#e8e6e1; --muted:#9d988f; --card:#1c1b19; --line:#302e2b; --soft:#252421;
    --accent:#7aa2f7; --accent-soft:#1f2a44; --code:#201f1d;
    --t-ui:#a78bfa; --t-ctrl:#60a5fa; --t-svc:#34d399; --t-repo:#fb923c; --t-ent:#fb7185;
    --t-db:#22d3ee; --t-cfg:#facc15; --t-otro:#a8a29e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace; }

  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  .titulo { flex: 1 1 320px; min-width: 0; }
  .titulo h1 { font-size: 16px; margin: 0; }
  .titulo p { margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 4px; background: var(--soft); padding: 3px; border-radius: 8px; }
  .tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; cursor: pointer; }
  .tabs button.activa { background: var(--card); box-shadow: 0 1px 2px rgb(0 0 0 / .08); font-weight: 600; }
  #buscar { width: 240px; max-width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); }

  .vista { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .vista[hidden] { display: none; }
  .barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); min-height: 46px; }
  .migas { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; margin: 0; padding: 0; list-style: none; }
  .migas li + li::before { content: "›"; color: var(--muted); margin: 0 6px; }
  .migas button { border: 0; background: none; padding: 2px 4px; border-radius: 4px; cursor: pointer; color: var(--accent); }
  .migas li:last-child button { color: var(--fg); font-weight: 600; cursor: default; }
  .ayuda { margin-left: auto; color: var(--muted); font-size: 12px; }

  .cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .lienzo { overflow: auto; position: relative; }
  .lienzo svg { display: block; }
  aside.panel { border-left: 1px solid var(--line); background: var(--card); overflow-y: auto; padding: 18px 20px 28px; }
  @media (max-width: 860px) {
    .cuerpo { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 55vh) auto; }
    aside.panel { border-left: 0; border-top: 1px solid var(--line); }
    .ayuda { display: none; }
  }

  /* nodos del grafo */
  .nodo { cursor: pointer; }
  .nodo rect.caja { fill: var(--card); stroke: var(--line); stroke-width: 1; transition: stroke .15s; }
  .nodo:hover rect.caja { stroke: var(--muted); }
  .nodo.sel rect.caja { stroke: var(--accent); stroke-width: 2; }
  .nodo .nombre { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .nodo .sub { font-size: 11px; fill: var(--muted); }
  .nodo .entrar { font-size: 15px; fill: var(--muted); }
  .nodo.tenue { opacity: .3; }
  .nodo.ghost rect.caja { fill: transparent; stroke-dasharray: 5 4; }
  .nodo.ghost .nombre { font-weight: 500; fill: var(--muted); }
  .nodo.ghost:hover .nombre { fill: var(--fg); }
  .arista path { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .55; }
  .arista text { font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
  .arista.activa path { stroke: var(--accent); opacity: 1; stroke-width: 1.8; }
  .arista.activa text { fill: var(--accent); }
  .arista.tenue { opacity: .15; }
  .columna-titulo { font-size: 11px; fill: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  /* panel */
  .panel h2 { font-size: 18px; margin: 0 0 6px; word-break: break-word; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .chip { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
  .chip.tipo { color: var(--card); font-weight: 600; }
  .ruta { font-size: 12px; color: var(--accent); word-break: break-all; margin: 0 0 12px; }
  .panel p { margin: 0 0 10px; }
  .panel h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  .porque { border-left: 3px solid var(--line); padding-left: 10px; }
  .pregunta { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .pregunta strong { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 2px; }
  .vacio { color: var(--muted); font-style: italic; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .btn { border: 1px solid var(--line); background: var(--bg); padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primario { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .btn:disabled { opacity: .4; cursor: default; }
  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .lista li:last-child { border-bottom: 0; }
  .lista .l { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .lista button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
  .verbo { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--soft); }
  pre.codigo { background: var(--code); border-radius: 8px; padding: 10px 0; overflow-x: auto; font-size: 12px; line-height: 1.55; margin: 6px 0 0; }
  pre.codigo span { display: block; padding: 0 12px 0 0; white-space: pre; }
  pre.codigo i { font-style: normal; color: var(--muted); display: inline-block; width: 44px; text-align: right; padding-right: 12px; user-select: none; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }

  /* flujos */
  .flujos-lista { display: flex; gap: 6px; flex-wrap: wrap; }
  .flujos-lista button { border: 1px solid var(--line); background: var(--card); padding: 4px 12px; border-radius: 99px; cursor: pointer; }
  .flujos-lista button.activa { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .seq .cab rect.caja { fill: var(--card); stroke: var(--line); }
  .seq .cab text { font-size: 12.5px; font-weight: 600; fill: var(--fg); }
  .seq .cab .sub { font-size: 10.5px; font-weight: 400; fill: var(--muted); }
  .seq .vida { stroke: var(--line); stroke-dasharray: 4 4; }
  .seq .msg { cursor: pointer; }
  .seq .msg path, .seq .msg line { stroke: var(--muted); stroke-width: 1.3; fill: none; }
  .seq .msg text { font-size: 12px; fill: var(--muted); }
  .seq .msg rect.hit { fill: transparent; }
  .seq .msg:hover text { fill: var(--fg); }
  .seq .msg.actual path, .seq .msg.actual line { stroke: var(--accent); stroke-width: 2.2; }
  .seq .msg.actual text { fill: var(--accent); font-weight: 600; }
  .seq .msg.hecho text { fill: var(--fg); }
  .seq .activo rect.caja { stroke: var(--accent); stroke-width: 2; }
  .lienzo svg.ajustado { width: 100%; height: auto; }
  .leyenda { font-size: 11px; fill: var(--muted); }
  .paso-n { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .accion { font-size: 16px; font-weight: 600; margin: 0 0 8px; }

  .aviso { margin: 40px auto; max-width: 520px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
</style>
</head>
<body>
<header>
  <div class="titulo"><h1 id="t-nombre">Atlas del código</h1><p id="t-resumen"></p></div>
  <nav class="tabs" aria-label="Vistas">
    <button data-vista="explorar" class="activa">Explorar</button>
    <button data-vista="flujos">Flujos</button>
  </nav>
  <input id="buscar" list="opciones" placeholder="Buscar clase, módulo, archivo…" autocomplete="off">
  <datalist id="opciones"></datalist>
</header>

<section class="vista" id="vista-explorar">
  <div class="barra"><ol class="migas" id="migas"></ol><span class="ayuda">Click: ver · Doble click o “Entrar”: bajar un nivel · Esc: subir</span></div>
  <div class="cuerpo"><div class="lienzo" id="grafo"></div><aside class="panel" id="panel"></aside></div>
</section>

<section class="vista" id="vista-flujos" hidden>
  <div class="barra"><div class="flujos-lista" id="flujos-lista"></div><span class="ayuda">← → para avanzar paso a paso</span></div>
  <div class="cuerpo"><div class="lienzo" id="secuencia"></div><aside class="panel" id="paso"></aside></div>
</section>

<script id="atlas-datos" type="application/json">__ATLAS_DATOS__</script>
<script>
(() => {
  "use strict";
  const SVG = "http://www.w3.org/2000/svg";
  const $ = (s) => document.querySelector(s);

  let A;
  try { A = JSON.parse(document.getElementById("atlas-datos").textContent); }
  catch {
    document.body.innerHTML = '<div class="aviso"><h2>Plantilla sin datos</h2><p>Este archivo es el template. Generá el atlas con <code>python scripts/build.py &lt;repo&gt;</code>.</p></div>';
    return;
  }

  // ───────────── índices ─────────────
  const nodos = new Map(A.nodos.map((n) => [n.id, n]));
  const hijos = new Map();
  for (const n of A.nodos) {
    if (!n.padre || !nodos.has(n.padre)) continue;
    if (!hijos.has(n.padre)) hijos.set(n.padre, []);
    hijos.get(n.padre).push(n.id);
  }
  const raiz = A.nodos.find((n) => n.nivel === "sistema")?.id || A.nodos[0].id;
  const flujos = A.flujos || [];

  const cacheAnc = new Map();
  function ancestros(id) { // [id, padre, abuelo, ..., raiz]
    if (cacheAnc.has(id)) return cacheAnc.get(id);
    const out = [];
    let cur = id, guard = 0;
    while (cur && nodos.has(cur) && guard++ < 50) { out.push(cur); cur = nodos.get(cur).padre; }
    cacheAnc.set(id, out);
    return out;
  }
  function hijoDirecto(de, id) {
    const c = ancestros(id);
    const i = c.indexOf(de);
    return i > 0 ? c[i - 1] : null;
  }
  function esDescendiente(id, de) { return ancestros(id).includes(de); }

  const cacheAristas = new Map();
  function aristasEntre(padre) { // relaciones "levantadas" al nivel de los hijos de padre
    if (cacheAristas.has(padre)) return cacheAristas.get(padre);
    const m = new Map();
    for (const r of A.relaciones) {
      const a = hijoDirecto(padre, r.de), b = hijoDirecto(padre, r.a);
      if (!a || !b || a === b) continue;
      const k = a + "\u0000" + b;
      if (!m.has(k)) m.set(k, { de: a, a: b, n: 0, etiquetas: new Set() });
      const e = m.get(k); e.n++; e.etiquetas.add(r.etiqueta || "usa");
    }
    const lista = [...m.values()];
    cacheAristas.set(padre, lista);
    return lista;
  }

  const RANGO = { sistema: 0, react: 0, vue: 0, angular: 0, svelte: 0, node: 1, "spring-boot": 1, fastapi: 1, django: 1, flask: 1, java: 1, python: 1,
    db: 3, infra: 4, pagina: 0, rutas: 0, "componente-ui": 1, "modulo-ui": 1, hook: 2, contexto: 2, estado: 2, "servicio-api": 3,
    aplicacion: 0, controller: 1, "manejo-errores": 1, service: 2, mapper: 3, repository: 3, entity: 4, dto: 5, enum: 5,
    config: 6, component: 3, util: 6, excepcion: 6, interface: 3, clase: 4, modulo: 4, paquete: 2, directorio: 2, metodo: 0 };
  const rango = (t) => RANGO[t] ?? 5;

  function colorTipo(t) {
    if (["react", "vue", "angular", "svelte", "pagina", "componente-ui", "modulo-ui", "hook", "contexto", "estado", "rutas"].includes(t)) return "var(--t-ui)";
    if (["controller", "manejo-errores", "servicio-api", "aplicacion", "spring-boot", "fastapi", "node", "java", "python", "django", "flask"].includes(t)) return "var(--t-ctrl)";
    if (["service", "mapper", "component"].includes(t)) return "var(--t-svc)";
    if (t === "repository") return "var(--t-repo)";
    if (t === "entity") return "var(--t-ent)";
    if (t === "db") return "var(--t-db)";
    if (["config", "infra"].includes(t)) return "var(--t-cfg)";
    return "var(--t-otro)";
  }

  // un módulo se colorea por el tipo dominante de lo que contiene
  const tipoVis = new Map();
  for (const n of A.nodos) {
    if (n.nivel !== "modulo") continue;
    const cuenta = {};
    for (const h of hijos.get(n.id) || []) { const t = nodos.get(h).tipo; cuenta[t] = (cuenta[t] || 0) + 1; }
    const dom = Object.entries(cuenta).sort((a, b) => b[1] - a[1])[0];
    if (dom) tipoVis.set(n.id, dom[0]);
  }
  const tipoDe = (n) => tipoVis.get(n.id) || n.tipo;

  function flecha(id, color) {
    return sv("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse" },
      sv("path", { d: "M0,0 L10,5 L0,10 z", fill: color }));
  }
  function ajustar(cont, svg, ancho) { // si sobra poco, escalar para que entre sin scroll
    const e = cont.clientWidth / ancho;
    if (e < 1 && e >= 0.6) svg.classList.add("ajustado");
  }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "class") e.className = v;
      else e.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
    return e;
  }
  function sv(tag, attrs = {}, ...kids) {
    const e = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null) continue;
      if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  }
  const corto = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
  const ubic = (n, linea) => (n.archivo ? n.archivo + (linea || n.linea ? ":" + (linea || n.linea) : "") : "");

  // ───────────── estado / URL ─────────────
  const estado = { vista: "explorar", actual: raiz, sel: null, flujo: 0, paso: 0 };

  function leerHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.has("f")) {
      estado.vista = "flujos";
      estado.flujo = Math.max(0, flujos.findIndex((f) => f.id === p.get("f")));
      estado.paso = Math.max(0, parseInt(p.get("p") || "0", 10) || 0);
    } else {
      estado.vista = "explorar";
      const a = p.get("n");
      estado.actual = a && nodos.has(a) && hijos.has(a) ? a : raiz;
      const s = p.get("s");
      estado.sel = s && nodos.has(s) ? s : null;
    }
  }
  function escribirHash() {
    const p = new URLSearchParams();
    if (estado.vista === "flujos" && flujos.length) { p.set("f", flujos[estado.flujo].id || String(estado.flujo)); p.set("p", estado.paso); }
    else { p.set("n", estado.actual); if (estado.sel) p.set("s", estado.sel); }
    const h = "#" + p.toString();
    if (location.hash !== h) history.pushState(null, "", h);
  }
  function ir(cambios) { Object.assign(estado, cambios); escribirHash(); render(); }

  function irANodo(id) { // muestra el nodo en el contexto de su padre
    const n = nodos.get(id);
    if (!n) return;
    if (id === raiz) return ir({ vista: "explorar", actual: raiz, sel: null });
    ir({ vista: "explorar", actual: n.padre && nodos.has(n.padre) ? n.padre : raiz, sel: id });
  }
  function entrar(id) { if (hijos.has(id)) ir({ vista: "explorar", actual: id, sel: null }); }

  // ───────────── layout por capas (Sugiyama simplificado) ─────────────
  function layout(ids, aristas, vertical) {
    const W = 200, H = 54, PX = 28, PY = 40;
    const GX = vertical ? 16 : 90, GY = vertical ? 64 : 18;
    const sal = new Map(ids.map((i) => [i, []])), ent = new Map(ids.map((i) => [i, []]));
    for (const a of aristas) { sal.get(a.de).push(a.a); ent.get(a.a).push(a.de); }

    const visto = new Map(), atras = new Set();
    const orden0 = [...ids].sort((x, y) => rango(nodos.get(x).tipo) - rango(nodos.get(y).tipo) || nodos.get(x).nombre.localeCompare(nodos.get(y).nombre));
    const dfs = (u) => {
      visto.set(u, 1);
      for (const v of sal.get(u)) {
        if (visto.get(v) === 1) atras.add(u + "\u0000" + v);
        else if (!visto.get(v)) dfs(v);
      }
      visto.set(u, 2);
    };
    for (const i of orden0) if (!visto.get(i)) dfs(i);

    const memo = new Map();
    const prof = (v) => {
      if (memo.has(v)) return memo.get(v);
      let m = 0;
      for (const u of ent.get(v)) if (!atras.has(u + "\u0000" + v)) m = Math.max(m, prof(u) + 1);
      memo.set(v, m);
      return m;
    };
    const conectados = orden0.filter((i) => sal.get(i).length || ent.get(i).length);
    const aislados = orden0.filter((i) => !sal.get(i).length && !ent.get(i).length);

    const cols = [];
    for (const i of conectados) { const c = prof(i); (cols[c] ||= []).push(i); }
    for (let c = 0; c < cols.length; c++) cols[c] ||= [];
    const inicioAislados = cols.length;
    const MAXCOL = 12;
    for (let k = 0; k < aislados.length; k += MAXCOL) cols.push(aislados.slice(k, k + MAXCOL));

    // ordenar por baricentro respecto de columnas previas (2 pasadas)
    const pos = new Map();
    const fijar = () => cols.forEach((col) => col.forEach((id, r) => pos.set(id, r)));
    fijar();
    for (let pasada = 0; pasada < 2; pasada++) {
      for (let c = 1; c < inicioAislados; c++) {
        const bari = (id) => { const ps = ent.get(id).filter((u) => pos.has(u)); return ps.length ? ps.reduce((s, u) => s + pos.get(u), 0) / ps.length : pos.get(id); };
        cols[c].sort((x, y) => bari(x) - bari(y));
        fijar();
      }
    }

    const maxFilas = Math.max(1, ...cols.map((c) => c.length));
    const coord = new Map();
    cols.forEach((col, c) => {
      if (vertical) {
        const off = ((maxFilas - col.length) * (W + GX)) / 2;
        col.forEach((id, r) => coord.set(id, { x: PX + off + r * (W + GX), y: PY + c * (H + GY), col: c }));
      } else {
        const off = ((maxFilas - col.length) * (H + GY)) / 2;
        col.forEach((id, r) => coord.set(id, { x: PX + c * (W + GX), y: PY + off + r * (H + GY), col: c }));
      }
    });
    const ancho = vertical ? PX * 2 + maxFilas * (W + GX) + 60 : PX * 2 + cols.length * W + (cols.length - 1) * GX + 60;
    const alto = vertical ? PY + cols.length * (H + GY) : PY + maxFilas * (H + GY) + 20;
    return { coord, W, H, ancho, alto, atras, inicioAislados, nCols: cols.length, vertical };
  }

  // ───────────── vista Explorar ─────────────
  function renderMigas() {
    const ol = $("#migas");
    ol.replaceChildren();
    const camino = ancestros(estado.actual).slice().reverse();
    for (const id of camino) {
      const n = nodos.get(id);
      ol.append(el("li", {}, el("button", { onclick: () => id !== estado.actual && ir({ actual: id, sel: null }) }, n.nombre)));
    }
  }

  function contexto(P, ids) { // vecinos externos de los hijos de P, al mismo nivel de detalle
    if (P === raiz) return { fantasmas: [], aristas: [] };
    const d = ancestros(P).length;
    const rep = (x) => { const c = ancestros(x).slice().reverse(); return c[Math.min(d, c.length - 1)]; };
    const m = new Map(), peso = new Map();
    for (const r of A.relaciones) {
      const a = hijoDirecto(P, r.de), b = hijoDirecto(P, r.a);
      let de, a2;
      if (a && !b) { de = a; a2 = rep(r.a); }
      else if (!a && b) { de = rep(r.de); a2 = b; }
      else continue;
      const ext = a ? a2 : de;
      if (!ext || esDescendiente(P, ext) || ids.includes(ext)) continue;
      const k = de + "\u0000" + a2;
      if (!m.has(k)) m.set(k, { de, a: a2, n: 0, etiquetas: new Set(), externa: true });
      const e = m.get(k); e.n++; e.etiquetas.add(r.etiqueta || "usa");
      peso.set(ext, (peso.get(ext) || 0) + 1);
    }
    const fantasmas = [...peso.entries()].sort((x, y) => y[1] - x[1]).slice(0, 14).map((x) => x[0]);
    const set = new Set(fantasmas);
    return { fantasmas, aristas: [...m.values()].filter((e) => set.has(e.de) || set.has(e.a)) };
  }

  function etiquetaArista(a) {
    const et = [...a.etiquetas];
    let base = et.length === 1 ? et[0]
      : et.every((e) => e.startsWith("HTTP")) ? "HTTP"
      : new Set(et.map((e) => e.split(" ")[0])).size === 1 ? et[0].split(" ")[0] : "usa";
    if (base === "usa") return a.n > 1 ? "×" + a.n : "";
    return a.n > 1 ? corto(base, 22) + " ×" + a.n : corto(base, 30);
  }

  function renderGrafo() {
    const cont = $("#grafo");
    const ids = hijos.get(estado.actual) || [];
    cont.replaceChildren();
    if (!ids.length) { cont.append(el("p", { class: "aviso" }, "Este nivel no tiene elementos.")); return; }
    if (ids.length > 90) { cont.append(listaPlana(ids)); return; }

    const ctx = contexto(estado.actual, ids);
    const fantasmas = new Set(ctx.fantasmas);
    const todos = [...ids, ...ctx.fantasmas];
    const aristas = [...aristasEntre(estado.actual), ...ctx.aristas];
    const vertical = cont.clientWidth < 700;
    const L = layout(todos, aristas, vertical);

    const svg = sv("svg", { width: L.ancho, height: L.alto, viewBox: `0 0 ${L.ancho} ${L.alto}`, role: "img", "aria-label": "Diagrama de " + nodos.get(estado.actual).nombre });
    svg.append(sv("defs", {}, flecha("fl", "var(--muted)"), flecha("fl-a", "var(--accent)")));
    if (fantasmas.size) svg.append(sv("text", { class: "leyenda", x: 28, y: 20 }, "Línea punteada: fuera de " + nodos.get(estado.actual).nombre + " (click para ir)"));

    const sel = estado.sel && todos.includes(estado.sel) ? estado.sel : null;
    const vecinos = new Set(sel ? [sel] : []);
    if (sel) for (const a of aristas) { if (a.de === sel) vecinos.add(a.a); if (a.a === sel) vecinos.add(a.de); }

    const gA = sv("g");
    for (const a of aristas) {
      const p = L.coord.get(a.de), q = L.coord.get(a.a);
      let d, mx, my;
      if (L.vertical && q.col > p.col) {
        const x1 = p.x + L.W / 2, y1 = p.y + L.H, x2 = q.x + L.W / 2, y2 = q.y - 2, dy = (y2 - y1) / 2;
        d = `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`;
        mx = (x1 + x2) / 2 + 4; my = (y1 + y2) / 2;
      } else if (!L.vertical && q.col > p.col) {
        const y1 = p.y + L.H / 2, y2 = q.y + L.H / 2, x1 = p.x + L.W, x2 = q.x - 2, dx = (x2 - x1) / 2;
        d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
        mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
      } else { // misma columna o hacia atrás: rodear por la derecha
        const y1 = p.y + L.H / 2, y2 = q.y + L.H / 2, x1 = p.x + L.W, x2 = q.x + L.W + 2;
        const bulto = 50 + Math.abs(y2 - y1) * 0.15 + Math.abs(x2 - x1) * 0.1;
        d = `M${x1},${y1} C${x1 + bulto},${y1} ${x2 + bulto},${y2} ${x2},${y2}`;
        mx = Math.max(x1, x2) + bulto * 0.75; my = (y1 + y2) / 2;
      }
      const activa = sel && (a.de === sel || a.a === sel);
      const g = sv("g", { class: "arista" + (activa ? " activa" : sel ? " tenue" : "") });
      g.append(sv("path", { d, "marker-end": activa ? "url(#fl-a)" : "url(#fl)", "stroke-dasharray": a.externa ? "4 4" : null }));
      const texto = etiquetaArista(a);
      if (texto) g.append(sv("text", { x: mx, y: my - 4, "text-anchor": L.vertical ? "start" : "middle" }, texto));
      g.append(sv("title", {}, `${nodos.get(a.de).nombre} → ${nodos.get(a.a).nombre}\n${[...a.etiquetas].join("\n")}${a.n > 1 ? `\n(${a.n} relaciones)` : ""}`));
      gA.append(g);
    }
    svg.append(gA);

    for (const id of todos) {
      const n = nodos.get(id), c = L.coord.get(id);
      const fantasma = fantasmas.has(id);
      const nh = (hijos.get(id) || []).length;
      const g = sv("g", { class: "nodo" + (fantasma ? " ghost" : "") + (id === sel ? " sel" : "") + (sel && !vecinos.has(id) ? " tenue" : ""), transform: `translate(${c.x},${c.y})`, tabindex: 0, role: "button" });
      g.append(sv("title", {}, n.nombre + (n.resumen ? "\n" + n.resumen : "")));
      g.append(sv("rect", { class: "caja", width: L.W, height: L.H, rx: 8 }));
      g.append(sv("rect", { x: 0, y: 0, width: 4, height: L.H, rx: 2, style: `fill:${colorTipo(tipoDe(n))};opacity:${fantasma ? 0.5 : 1}` }));
      g.append(sv("text", { class: "nombre", x: 14, y: 22 }, corto(n.nombre, nh && !fantasma ? 22 : 25)));
      const sub = fantasma
        ? "en " + (nodos.get(n.padre)?.nombre || "")
        : [tipoDe(n), nh ? `${nh} ${nh === 1 ? "elemento" : "elementos"}` : null, n.endpoints?.length ? `${n.endpoints.length} endpoints` : null].filter(Boolean).join(" · ");
      g.append(sv("text", { class: "sub", x: 14, y: 40 }, corto(sub, 30)));
      if (nh && !fantasma) g.append(sv("text", { class: "entrar", x: L.W - 16, y: 33 }, "›"));
      if (fantasma) {
        g.addEventListener("click", () => irANodo(id));
        g.addEventListener("keydown", (e) => { if (e.key === "Enter") irANodo(id); });
      } else {
        g.addEventListener("click", () => ir({ sel: id }));
        g.addEventListener("dblclick", () => entrar(id));
        g.addEventListener("keydown", (e) => { if (e.key === "Enter") (estado.sel === id ? entrar(id) : ir({ sel: id })); });
      }
      svg.append(g);
    }
    cont.append(svg);
    ajustar(cont, svg, L.ancho);
    if (L.vertical) cont.scrollLeft = Math.max(0, (L.ancho - cont.clientWidth) / 2);
  }

  function listaPlana(ids) {
    const grupos = new Map();
    for (const id of ids) { const t = nodos.get(id).tipo || "otro"; if (!grupos.has(t)) grupos.set(t, []); grupos.get(t).push(id); }
    const div = el("div", { style: "padding:20px 24px" }, el("p", { class: "vacio" }, `${ids.length} elementos: demasiados para un diagrama legible. Agrupados por tipo:`));
    for (const [t, lista] of [...grupos].sort((a, b) => rango(a[0]) - rango(b[0]))) {
      div.append(el("h3", {}, `${t} (${lista.length})`));
      div.append(el("ul", { class: "lista" }, lista.map((id) => el("li", {}, el("button", { onclick: () => ir({ sel: id }) }, nodos.get(id).nombre), el("span", { class: "l" }, nodos.get(id).archivo || "")))));
    }
    return div;
  }

  function bloqueCodigo(c) {
    const pre = el("pre", { class: "codigo" });
    c.codigo.split("\n").forEach((ln, i) => pre.append(el("span", {}, el("i", {}, String(c.desde + i)), ln)));
    return pre;
  }

  function botonNodo(id) {
    const n = nodos.get(id);
    return el("li", {}, el("button", { onclick: () => irANodo(id) }, n.nombre), el("span", { class: "l" }, n.tipo || ""));
  }

  function renderPanel() {
    const p = $("#panel");
    const id = estado.sel || estado.actual;
    const n = nodos.get(id);
    p.replaceChildren();
    const nh = (hijos.get(id) || []).length;

    p.append(el("h2", {}, n.nombre));
    const tipoChip = el("span", { class: "chip tipo", style: `background:${colorTipo(n.tipo)}` }, n.tipo || n.nivel);
    p.append(el("div", { class: "chips" }, tipoChip, el("span", { class: "chip" }, n.nivel), nh ? el("span", { class: "chip" }, `${nh} adentro`) : null));
    if (n.archivo && n.archivo !== ".") p.append(el("div", { class: "ruta mono" }, ubic(n)));

    if (n.resumen) p.append(el("p", {}, n.resumen));
    else p.append(el("p", { class: "vacio" }, "Sin explicación todavía."));
    if (n.porque) { p.append(el("h3", {}, "Por qué está así")); p.append(el("p", { class: "porque" }, n.porque)); }
    if (n.pregunta) p.append(el("div", { class: "pregunta" }, el("strong", {}, "Para pensar"), n.pregunta));

    const acc = el("div", { class: "acciones" });
    if (nh && id !== estado.actual) acc.append(el("button", { class: "btn primario", onclick: () => entrar(id) }, `Entrar (${nh}) →`));
    if (id === estado.actual && n.padre) acc.append(el("button", { class: "btn", onclick: () => irANodo(id) }, "↑ Subir"));
    if (acc.children.length) p.append(acc);

    if (n.codigo) { p.append(el("h3", {}, "Código")); p.append(bloqueCodigo(n.codigo)); }

    if (n.endpoints?.length) {
      p.append(el("h3", {}, `Endpoints (${n.endpoints.length})`));
      p.append(el("ul", { class: "lista" }, n.endpoints.map((e) => el("li", {}, el("span", { class: "verbo" }, e.metodo), el("span", { class: "mono" }, e.ruta), el("span", { class: "l" }, ":" + e.linea)))));
    }
    if (n.http?.length) {
      p.append(el("h3", {}, `Llamadas HTTP (${n.http.length})`));
      p.append(el("ul", { class: "lista" }, n.http.map((e) => el("li", {}, el("span", { class: "verbo" }, e.metodo), el("span", { class: "mono" }, corto(e.ruta, 40)), el("span", { class: "l" }, ":" + e.linea)))));
    }

    if (n.padre && nodos.has(n.padre)) {
      const ar = [...aristasEntre(n.padre), ...contexto(n.padre, hijos.get(n.padre) || []).aristas];
      const usa = ar.filter((a) => a.de === id).map((a) => a.a);
      const usan = ar.filter((a) => a.a === id).map((a) => a.de);
      if (usa.length) { p.append(el("h3", {}, `Depende de (${usa.length})`)); p.append(el("ul", { class: "lista" }, usa.map(botonNodo))); }
      if (usan.length) { p.append(el("h3", {}, `Lo usan (${usan.length})`)); p.append(el("ul", { class: "lista" }, usan.map(botonNodo))); }
    }

    const enFlujos = [];
    flujos.forEach((f, fi) => {
      const j = f.pasos.findIndex((s) => esDescendiente(s.nodo, id));
      if (j >= 0) enFlujos.push([fi, j]);
    });
    if (enFlujos.length) {
      p.append(el("h3", {}, "Aparece en flujos"));
      p.append(el("ul", { class: "lista" }, enFlujos.map(([fi, j]) => el("li", {}, el("button", { onclick: () => ir({ vista: "flujos", flujo: fi, paso: j }) }, flujos[fi].nombre), el("span", { class: "l" }, `paso ${j + 1}`)))));
    }

    const metodos = n.metodos || [];
    if (metodos.length) {
      const det = el("details", metodos.length <= 8 ? { open: "" } : {}, el("summary", {}, `Métodos / funciones (${metodos.length})`));
      det.append(el("ul", { class: "lista" }, metodos.map((m) => el("li", {}, el("span", { class: "mono" }, m.nombre), el("span", { class: "l" }, ":" + m.linea)))));
      p.append(el("h3", {}, "Estructura"));
      p.append(det);
    }
  }

  // ───────────── vista Flujos ─────────────
  function renderFlujos() {
    const lista = $("#flujos-lista"), lienzo = $("#secuencia"), panel = $("#paso");
    lista.replaceChildren(); lienzo.replaceChildren(); panel.replaceChildren();
    if (!flujos.length) {
      lienzo.append(el("div", { class: "aviso" }, el("h3", {}, "Todavía no hay flujos"), el("p", {}, "Los flujos se agregan en enrich.json (casos de uso trazados paso a paso por el código).")));
      return;
    }
    estado.flujo = Math.min(estado.flujo, flujos.length - 1);
    flujos.forEach((f, i) => lista.append(el("button", { class: i === estado.flujo ? "activa" : "", onclick: () => ir({ flujo: i, paso: 0 }) }, f.nombre)));

    const f = flujos[estado.flujo];
    const pasos = f.pasos;
    estado.paso = Math.min(Math.max(0, estado.paso), pasos.length - 1);

    // participantes en orden de aparición
    const actor = f.actor || "Usuario";
    const parts = ["__actor"];
    for (const s of pasos) if (!parts.includes(s.nodo)) parts.push(s.nodo);
    const CW = 170, PX = 24, TOP = 16, HH = 46, ROW = 46, Y0 = TOP + HH + 34;
    const ancho = PX * 2 + parts.length * CW, alto = Y0 + pasos.length * ROW + 20;
    const cx = (id) => PX + parts.indexOf(id) * CW + CW / 2;

    const svg = sv("svg", { class: "seq", width: ancho, height: alto, viewBox: `0 0 ${ancho} ${alto}`, role: "img", "aria-label": "Diagrama de secuencia: " + f.nombre });
    svg.append(sv("defs", {}, flecha("sq", "var(--muted)"), flecha("sq-a", "var(--accent)")));

    const activo = pasos[estado.paso].nodo;
    parts.forEach((id, i) => {
      const x = PX + i * CW + 8, w = CW - 16;
      const nombre = id === "__actor" ? actor : nodos.get(id).nombre;
      const tipo = id === "__actor" ? "actor" : nodos.get(id).tipo;
      const g = sv("g", { class: "cab" + (id === activo ? " activo" : "") });
      g.append(sv("rect", { class: "caja", x, y: TOP, width: w, height: HH, rx: 8 }));
      g.append(sv("rect", { x, y: TOP, width: 4, height: HH, rx: 2, style: "fill:" + (id === "__actor" ? "var(--muted)" : colorTipo(tipo)) }));
      g.append(sv("text", { x: x + w / 2, y: TOP + 20, "text-anchor": "middle" }, corto(nombre, 20)));
      g.append(sv("text", { class: "sub", x: x + w / 2, y: TOP + 36, "text-anchor": "middle" }, tipo));
      g.append(sv("title", {}, nombre));
      if (id !== "__actor") { g.style.cursor = "pointer"; g.addEventListener("click", () => irANodo(id)); }
      svg.append(g);
      svg.append(sv("line", { class: "vida", x1: x + w / 2, y1: TOP + HH, x2: x + w / 2, y2: alto - 10 }));
    });

    pasos.forEach((s, i) => {
      const de = i === 0 ? "__actor" : pasos[i - 1].nodo;
      const y = Y0 + i * ROW;
      const x1 = cx(de), x2 = cx(s.nodo);
      const cls = "msg" + (i === estado.paso ? " actual" : i < estado.paso ? " hecho" : "");
      const g = sv("g", { class: cls });
      const marker = i === estado.paso ? "url(#sq-a)" : "url(#sq)";
      const texto = `${i + 1}. ${s.accion || nodos.get(s.nodo).nombre}`;
      if (x1 === x2) {
        g.append(sv("path", { d: `M${x1},${y - 8} h36 v16 h-34`, "marker-end": marker }));
        g.append(sv("text", { x: x1 + 44, y: y + 4 }, corto(texto, 34)));
        g.append(sv("rect", { class: "hit", x: x1, y: y - 22, width: CW, height: ROW - 4 }));
      } else {
        g.append(sv("line", { x1, y1: y, x2: x2 + (x2 > x1 ? -2 : 2), y2: y, "marker-end": marker }));
        const max = Math.max(16, Math.floor(Math.abs(x2 - x1) / 6.4));
        g.append(sv("text", { x: (x1 + x2) / 2, y: y - 7, "text-anchor": "middle" }, corto(texto, max)));
        g.append(sv("rect", { class: "hit", x: Math.min(x1, x2), y: y - 24, width: Math.abs(x2 - x1), height: ROW - 6 }));
      }
      g.append(sv("title", {}, texto));
      g.addEventListener("click", () => ir({ paso: i }));
      svg.append(g);
    });
    lienzo.append(svg);
    ajustar(lienzo, svg, ancho);

    // panel del paso
    const s = pasos[estado.paso], n = nodos.get(s.nodo);
    panel.append(el("div", { class: "paso-n" }, `${f.nombre} · paso ${estado.paso + 1} de ${pasos.length}`));
    if (estado.paso === 0 && f.resumen) panel.append(el("p", { class: "vacio" }, f.resumen));
    panel.append(el("p", { class: "accion" }, s.accion || n.nombre));
    panel.append(el("div", { class: "chips" }, el("span", { class: "chip tipo", style: `background:${colorTipo(n.tipo)}` }, n.tipo), el("span", {}, el("button", { class: "btn", onclick: () => irANodo(s.nodo) }, "Ver " + n.nombre + " en el mapa"))));
    if (s.archivo) panel.append(el("div", { class: "ruta mono" }, s.archivo + (s.codigo ? ":" + s.codigo.desde : "")));
    if (s.explicacion) panel.append(el("p", {}, s.explicacion));
    if (s.codigo) panel.append(bloqueCodigo(s.codigo));
    if (s.pregunta) panel.append(el("div", { class: "pregunta" }, el("strong", {}, "Para pensar"), s.pregunta));
    panel.append(el("div", { class: "acciones" },
      el("button", { class: "btn", disabled: estado.paso === 0 ? "" : null, onclick: () => ir({ paso: estado.paso - 1 }) }, "← Anterior"),
      el("button", { class: "btn primario", disabled: estado.paso === pasos.length - 1 ? "" : null, onclick: () => ir({ paso: estado.paso + 1 }) }, "Siguiente →")));

    // asegurar que el mensaje actual quede visible
    const yAct = Y0 + estado.paso * ROW;
    if (yAct < lienzo.scrollTop + 60 || yAct > lienzo.scrollTop + lienzo.clientHeight - 60) lienzo.scrollTop = Math.max(0, yAct - lienzo.clientHeight / 2);
  }

  // ───────────── general ─────────────
  function render() {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("activa", b.dataset.vista === estado.vista));
    $("#vista-explorar").hidden = estado.vista !== "explorar";
    $("#vista-flujos").hidden = estado.vista !== "flujos";
    if (estado.vista === "explorar") { renderMigas(); renderGrafo(); renderPanel(); }
    else renderFlujos();
  }

  // cabecera
  const sis = nodos.get(raiz);
  $("#t-nombre").textContent = sis.nombre;
  $("#t-resumen").textContent = sis.resumen || (A.generado ? "Generado " + A.generado.slice(0, 10) : "");
  document.title = "Atlas · " + sis.nombre;

  // búsqueda
  const etiquetaBusqueda = new Map();
  const dl = $("#opciones");
  for (const n of A.nodos) {
    if (n.nivel === "sistema") continue;
    const et = `${n.nombre} — ${n.tipo || n.nivel}${n.archivo && n.archivo !== "." ? " — " + n.archivo : ""}`;
    etiquetaBusqueda.set(et, n.id);
    dl.append(el("option", { value: et }));
  }
  $("#buscar").addEventListener("change", (e) => {
    const id = etiquetaBusqueda.get(e.target.value);
    if (id) { irANodo(id); e.target.value = ""; e.target.blur(); }
  });

  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => ir({ vista: b.dataset.vista })));
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (estado.vista === "flujos" && flujos.length) {
      const max = flujos[estado.flujo].pasos.length - 1;
      if (e.key === "ArrowRight" && estado.paso < max) ir({ paso: estado.paso + 1 });
      if (e.key === "ArrowLeft" && estado.paso > 0) ir({ paso: estado.paso - 1 });
    } else if (e.key === "Escape") {
      if (estado.sel) ir({ sel: null });
      else if (nodos.get(estado.actual).padre) irANodo(estado.actual);
    }
  });
  addEventListener("popstate", () => { leerHash(); render(); });

  leerHash();
  render();
})();
</script>
</body>
