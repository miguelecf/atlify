<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Atlify — portada social</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        width: 1200px;
        height: 630px;
        background: #183e32;
        color: white;
        padding: 46px 58px;
        overflow: hidden;
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 19px;
      }
      .card-top .brand {
        font-size: 37px;
      }
      .card-top img {
        width: 42px;
        height: 42px;
      }
      h1 {
        font-size: 79px;
        line-height: 1.03;
        letter-spacing: -0.06em;
        margin: 48px 0 24px;
        max-width: 1000px;
      }
      .card-description {
        font-size: 24px;
        max-width: 800px;
        line-height: 1.4;
      }
      .card-route {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 38px;
      }
      .card-route strong {
        background: #f3f3f1;
        color: #000;
        border: 2px solid black;
        border-radius: 5px;
        padding: 9px 24px;
        font-size: 18px;
        font-weight: 600;
      }
      .card-route span {
        font-size: 25px;
      }
      .card-bottom {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #ffffff66;
        padding-top: 19px;
        margin-top: 35px;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <div class="card-top">
      <div class="brand">
        <img src="favicon.svg" alt="" /><span>Atlify</span>
      </div>
      <p>Un skill para agentes de código</p>
    </div>
    <h1>Entendé el repo.<br />Antes de tocarlo.</h1>
    <p class="card-description">
      El mapa, los recorridos y los hallazgos de tu repo.<br />Un solo HTML, con
      referencias al código real.
    </p>
    <div class="card-route">
      <strong>Pantalla</strong><span aria-hidden="true">→</span
      ><strong>Endpoint</strong><span aria-hidden="true">→</span
      ><strong>Tabla</strong>
    </div>
    <div class="card-bottom">
      <span>Por Miguel Caraballo</span
      ><span>Código abierto · Offline · MIT</span>
    </div>
  </body>
</html>
