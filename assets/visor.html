<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas del código</title>
<style>
  :root {
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#eef1f5; --fg:#0f172a; --muted:#5b6b82; --line:#dfe5ed;
    --accent:#2563eb; --accent-soft:#e0eaff; --code-bg:#f8fafc; --hl:#fff6c7; --hl-line:#eab308;
    --front:#2563eb; --front-soft:#eef4ff; --back:#15803d; --back-soft:#effbf3; --db:#8b3fd9; --db-soft:#f7f0ff; --infra:#64748b;
    --get:#2563eb; --post:#15803d; --put:#c2410c; --patch:#a16207; --delete:#dc2626;
    --alta:#dc2626; --media:#c2410c; --baja:#64748b;
    --k:#7c3aed; --s:#15803d; --c:#94a3b8; --n:#c2410c; --d:#0e7490; --t:#2563eb;
    --sombra: 0 1px 2px rgb(15 23 42 / .06), 0 4px 16px rgb(15 23 42 / .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0a101d; --panel:#101a2d; --panel-2:#16223a; --fg:#e3e9f3; --muted:#8a9ab3; --line:#1f2d48;
      --accent:#6aa5ff; --accent-soft:#16294d; --code-bg:#0c1424; --hl:#33300f; --hl-line:#facc15;
      --front:#6aa5ff; --front-soft:#0f1c35; --back:#4ade80; --back-soft:#0c2117; --db:#c08bff; --db-soft:#1c1231; --infra:#94a3b8;
      --get:#6aa5ff; --post:#4ade80; --put:#fb923c; --patch:#facc15; --delete:#f87171;
      --alta:#f87171; --media:#fb923c; --baja:#94a3b8;
      --k:#c4b5fd; --s:#86efac; --c:#5f6f88; --n:#fdba74; --d:#67e8f9; --t:#93c5fd;
      --sombra: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0a101d; --panel:#101a2d; --panel-2:#16223a; --fg:#e3e9f3; --muted:#8a9ab3; --line:#1f2d48;
    --accent:#6aa5ff; --accent-soft:#16294d; --code-bg:#0c1424; --hl:#33300f; --hl-line:#facc15;
    --front:#6aa5ff; --front-soft:#0f1c35; --back:#4ade80; --back-soft:#0c2117; --db:#c08bff; --db-soft:#1c1231; --infra:#94a3b8;
    --get:#6aa5ff; --post:#4ade80; --put:#fb923c; --patch:#facc15; --delete:#f87171;
    --alta:#f87171; --media:#fb923c; --baja:#94a3b8;
    --k:#c4b5fd; --s:#86efac; --c:#5f6f88; --n:#fdba74; --d:#67e8f9; --t:#93c5fd;
    --sombra: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent); }
  .mono, code, pre { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ── cabecera ── */
  header.top { display: flex; align-items: center; gap: 18px; padding: 0 20px; height: 56px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .marca svg { color: var(--accent); }
  .marca small { font-weight: 500; color: var(--muted); font-size: 13px; }
  nav.tabs { display: flex; gap: 2px; height: 100%; overflow-x: auto; scrollbar-width: none; }
  nav.tabs a { display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  nav.tabs a:hover { color: var(--fg); }
  nav.tabs a.activa { color: var(--fg); border-bottom-color: var(--accent); }
  .cuenta { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
  .cuenta.alerta { background: color-mix(in srgb, var(--alta) 16%, transparent); color: var(--alta); }
  .der { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .buscador { position: relative; }
  .buscador input { width: 260px; padding: 7px 10px 7px 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  .buscador svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .resultados { position: absolute; right: 0; top: calc(100% + 6px); width: 420px; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sombra); z-index: 20; padding: 6px; }
  .resultados button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 6px; }
  .resultados button:hover, .resultados button.on { background: var(--panel-2); }
  .resultados .tipo { margin-left: auto; font-size: 11px; color: var(--muted); }
  .icono-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); }
  .icono-btn:hover { color: var(--fg); }
  @media (max-width: 900px) { .buscador input { width: 160px; } .resultados { width: 300px; } .marca small { display: none; } }
  @media (max-width: 720px) {
    header.top { flex-wrap: wrap; height: auto; padding: 8px 16px 0; gap: 8px 12px; }
    nav.tabs { order: 3; width: 100%; height: 42px; margin: 0 -16px; padding: 0 8px; border-top: 1px solid var(--line); }
    .buscador input { width: 150px; }
    .resultados { width: calc(100vw - 32px); right: -50px; }
    .pagina { padding: 16px 16px 40px; }
    .hero { flex-direction: column; }
    .mini-mapa { flex-direction: column; }
    .mini-mapa .flecha { flex-direction: row; gap: 6px; padding: 6px 0; }
    .mini-mapa .flecha svg { transform: rotate(90deg); }
  }

  main { flex: 1; min-height: 0; overflow: auto; }
  .pagina { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
  .pagina-titulo { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .pagina-titulo h1 { font-size: 22px; }
  .pagina-titulo p { margin: 4px 0 0; color: var(--muted); }

  /* ── piezas comunes ── */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .card h3 { font-size: 14px; margin-bottom: 10px; }
  .grid { display: grid; gap: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  a.chip { text-decoration: none; color: var(--fg); }
  a.chip:hover { background: var(--accent-soft); }
  .metodo { display: inline-block; min-width: 58px; text-align: center; font: 700 11px/1 ui-monospace, Menlo, monospace; padding: 5px 6px; border-radius: 5px; letter-spacing: .02em; }
  .metodo.GET { color: var(--get); background: color-mix(in srgb, var(--get) 14%, transparent); }
  .metodo.POST { color: var(--post); background: color-mix(in srgb, var(--post) 14%, transparent); }
  .metodo.PUT { color: var(--put); background: color-mix(in srgb, var(--put) 14%, transparent); }
  .metodo.PATCH { color: var(--patch); background: color-mix(in srgb, var(--patch) 14%, transparent); }
  .metodo.DELETE { color: var(--delete); background: color-mix(in srgb, var(--delete) 14%, transparent); }
  .metodo.grande { font-size: 14px; padding: 7px 10px; min-width: 0; }
  .sev { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .sev.alta { color: var(--alta); background: color-mix(in srgb, var(--alta) 14%, transparent); }
  .sev.media { color: var(--media); background: color-mix(in srgb, var(--media) 14%, transparent); }
  .sev.baja { color: var(--baja); background: color-mix(in srgb, var(--baja) 16%, transparent); }
  .punto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .punto.alta { background: var(--alta); } .punto.media { background: var(--media); } .punto.baja { background: var(--baja); }
  .nac { color: var(--c-nac); }
  .nac-frontend { --c-nac: var(--front); --c-soft: var(--front-soft); }
  .nac-backend { --c-nac: var(--back); --c-soft: var(--back-soft); }
  .nac-db { --c-nac: var(--db); --c-soft: var(--db-soft); }
  .nac-infra { --c-nac: var(--infra); --c-soft: var(--panel-2); }
  .chip.nac { background: color-mix(in srgb, var(--c-nac) 13%, transparent); color: var(--c-nac); font-weight: 600; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; color: var(--fg); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primario { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primario:hover { filter: brightness(1.08); color: #fff; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .link { border: 0; background: none; padding: 0; color: var(--accent); text-align: left; font: inherit; }
  .link:hover { text-decoration: underline; }
  .pregunta { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
  .pregunta b { display: block; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .vacio { color: var(--muted); font-style: italic; }
  .subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; overflow-x: auto; }
  .subtabs a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
  .subtabs a.activa { color: var(--fg); border-bottom-color: var(--accent); }
  .tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabla th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tabla td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tabla tr:last-child td { border-bottom: 0; }
  .tabla tr.click { cursor: pointer; }
  .tabla tr.click:hover td { background: var(--panel-2); }
  .etq { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
  .etq:first-child { margin-top: 0; }

  /* ── código ── */
  .codigo { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); margin-top: 8px; }
  .codigo-cab { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; }
  .codigo-cab .ruta { font-family: ui-monospace, Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .codigo-cab .der { gap: 4px; }
  .codigo-cab button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 5px; }
  .codigo-cab button:hover { color: var(--fg); background: var(--panel-2); }
  .codigo pre { margin: 0; padding: 8px 0; overflow: auto; font-size: 12.5px; line-height: 1.6; }
  .codigo pre.alto { max-height: 520px; }
  .ln { display: block; padding-right: 14px; white-space: pre; border-left: 3px solid transparent; }
  .ln i { display: inline-block; width: 46px; padding-right: 14px; text-align: right; color: var(--muted); font-style: normal; user-select: none; opacity: .7; }
  .ln.sel { background: var(--hl); border-left-color: var(--hl-line); }
  .ln.err { background: color-mix(in srgb, var(--alta) 12%, transparent); border-left-color: var(--alta); }
  .ln.err.media { background: color-mix(in srgb, var(--media) 12%, transparent); border-left-color: var(--media); }
  .ln.err.baja { background: color-mix(in srgb, var(--baja) 12%, transparent); border-left-color: var(--baja); }
  .ln .sk { color: var(--k); } .ln .ss { color: var(--s); } .ln .sc { color: var(--c); font-style: italic; } .ln .sn { color: var(--n); } .ln .sd { color: var(--d); } .ln .st { color: var(--t); }
  .salto { display: block; padding: 2px 0 2px 63px; color: var(--muted); font-size: 11.5px; }

  /* ── resumen ── */
  .hero { display: flex; gap: 18px; align-items: flex-start; }
  .hero .logo { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .hero h1 { font-size: 24px; }
  .hero p { margin: 6px 0 12px; color: var(--muted); max-width: 70ch; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
  .stat:hover { border-color: var(--accent); }
  .stat .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); color: var(--muted); }
  .stat b { display: block; font-size: 24px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .dos { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dos { grid-template-columns: 1fr; } }
  .mini-mapa { display: flex; align-items: stretch; gap: 0; }
  .mini-mapa a { flex: 1; text-decoration: none; color: inherit; border: 1.5px solid var(--c-nac); background: var(--c-soft); border-radius: 12px; padding: 14px; text-align: center; }
  .mini-mapa a:hover { box-shadow: var(--sombra); }
  .mini-mapa a b { display: block; color: var(--c-nac); margin: 6px 0 2px; }
  .mini-mapa a small { color: var(--muted); }
  .mini-mapa .flecha { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 6px; color: var(--muted); font-size: 11px; min-width: 64px; }
  .pasos-sugeridos { list-style: none; padding: 0; margin: 0; counter-reset: s; }
  .pasos-sugeridos > li { counter-increment: s; display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pasos-sugeridos > li:last-child { border-bottom: 0; }
  .pasos-sugeridos > li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex-shrink: 0; }

  /* ── mapa ── */
  .mapa { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
  .lienzo { overflow: auto; position: relative; }
  .plano { position: relative; display: grid; grid-template-columns: minmax(150px, 1fr) minmax(150px, 1fr) minmax(280px, 1.5fr) minmax(170px, 1fr); gap: 0 52px; padding: 18px 20px 40px; min-width: 960px; align-items: start; }
  .plano svg.cables { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
  .nacion { border: 1.5px solid color-mix(in srgb, var(--c-nac) 55%, transparent); background: var(--c-soft); border-radius: 16px; padding: 14px 14px 18px; position: relative; }
  .nacion.doble { grid-column: span 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 52px; align-content: start; }
  .nacion.doble > .nacion-cab { grid-column: 1 / -1; }
  .nacion-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .nacion-cab .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--c-nac); color: var(--panel); display: grid; place-items: center; flex-shrink: 0; }
  .nacion-cab h2 { font-size: 15px; color: var(--c-nac); }
  .nacion-cab small { color: var(--muted); font-size: 12px; }
  .grupo-t { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 4px 2px 8px; }
  .grupo-t:not(:first-of-type) { margin-top: 16px; }
  .nodo { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; transition: opacity .15s, border-color .15s, box-shadow .15s; position: relative; }
  .nodo:hover { border-color: var(--c-nac); }
  .nodo.foco { border-color: var(--c-nac); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-nac) 35%, transparent); }
  .nodo.tenue { opacity: .28; }
  .nodo .nom { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nodo .sub { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nodo .txt { min-width: 0; flex: 1; }
  .nodo .ruta-ep { font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .nodo .metodo { min-width: 50px; font-size: 10px; padding: 4px 5px; }
  .nodo .marcas { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  .nodo.fantasma { border-style: dashed; border-color: var(--alta); background: color-mix(in srgb, var(--alta) 6%, var(--panel)); }
  .nodo.fantasma .ruta-ep { text-decoration: line-through; color: var(--alta); }
  .sin-uso { font-size: 10px; font-weight: 600; color: var(--muted); border: 1px dashed var(--muted); padding: 0 5px; border-radius: 4px; }
  .internos { display: flex; flex-wrap: wrap; gap: 6px; }
  .interno { font-size: 11.5px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 8px; font-family: ui-monospace, Menlo, monospace; transition: opacity .15s; }
  .interno.foco { border-color: var(--back); color: var(--back); font-weight: 600; }
  .interno.tenue { opacity: .3; }
  .cable { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .22; transition: opacity .15s; }
  .cable.activo { stroke: var(--accent); opacity: .95; stroke-width: 2; }
  .cable.roto { stroke: var(--alta); stroke-dasharray: 5 4; opacity: .5; }
  .cable.roto.activo { opacity: 1; }
  .cable-et { font-size: 10.5px; font-weight: 600; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; font-family: ui-monospace, Menlo, monospace; }
  .leyenda-mapa { position: sticky; left: 0; display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 20px 0; font-size: 12px; color: var(--muted); align-items: center; }
  .leyenda-mapa span { display: inline-flex; align-items: center; gap: 6px; }
  aside.lateral { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 22px 32px; }
  aside.lateral h2 { font-size: 17px; word-break: break-word; }
  .participa { display: grid; gap: 10px; margin-top: 4px; }
  .participa .bloque { border-left: 3px solid var(--c-nac); padding: 2px 0 2px 12px; }
  .participa .bloque h4 { font-size: 12px; color: var(--c-nac); margin-bottom: 4px; }
  .participa ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .participa li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .participa li .l { margin-left: auto; color: var(--muted); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
  .op { font: 700 10px/1 ui-monospace, Menlo, monospace; padding: 3px 5px; border-radius: 4px; background: color-mix(in srgb, var(--db) 15%, transparent); color: var(--db); }
  @media (max-width: 1100px) { .mapa { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 62vh) auto; } aside.lateral { border-left: 0; border-top: 1px solid var(--line); } }

  /* ── endpoints ── */
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filtros input, .filtros select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); font: inherit; }
  .filtros input { flex: 1 1 220px; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .1); font-weight: 600; }
  .lado { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }
  .lado nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }

<script>
(() => {

}

// ───────────────────────── índices ─────────────────────────
const SEV = { alta: 0, media: 1, baja: 2 };
const SEV_TXT = { alta: "Alta", media: "Media", baja: "Baja" };
const uniq = (xs) => [...new Set(xs)];
const base = (p) => p.split("/").pop();
const epId = (e) => `${e.metodo} ${e.ruta}`;
const ARCH = A.archivos || {};
const NACIONES = A.naciones || [];

const nacionDe = (p) => ARCH[p]?.nacion || NACIONES.find((n) => n.dir && p.startsWith(n.dir + "/"))?.id || "infra";
const capaDe = (p) => ARCH[p]?.capa || "";
const CAPA_TXT = { pagina: "Pantalla", "cliente-api": "Cliente API", router: "Router", service: "Service", repository: "Repository",
  modelo: "Modelo", schema: "Schema", seguridad: "Seguridad", config: "Config", aplicacion: "Aplicación", rutas: "Rutas", db: "Base de datos" };

const HALL = [...(A.hallazgos || [])].sort((a, b) => SEV[a.severidad] - SEV[b.severidad]);
const HID = new Map(HALL.map((h) => [h.id, h]));
const TABLAS = A.tablas || [];
const TB = new Map(TABLAS.map((t) => [t.nombre, t]));
const ROTAS = (A.llamadas_rotas || []).map((r, i) => ({ ...r, id: "r" + i, usadoEn: r.usadoEn || [] }));
// modo foco: el atlas se generó para un solo endpoint (build.py --endpoint)
const FOCO = A.foco || null;

const EPS = (A.endpoints || []).map((e) => {
  const id = epId(e);
  const frontend = e.frontend || [];
  const pasos = e.pasos || [];
  return {
    ...e, id, frontend, pasos,
    hall: HALL.filter((h) => h.endpoint === id),
    pantallas: uniq(frontend.filter((r) => capaDe(r.archivo) === "pagina").map((r) => r.archivo)),
    clientes: uniq(frontend.filter((r) => capaDe(r.archivo) === "cliente-api").map((r) => r.archivo)),
    backend: uniq(pasos.filter((p) => p.archivo && nacionDe(p.archivo) === "backend").map((p) => p.archivo)),
    tbs: uniq((e.tablas || []).map((t) => t.tabla)),
  };
});
const EP = new Map(EPS.map((e) => [e.id, e]));
const opsDe = (e, t) => uniq((e.tablas || []).filter((x) => x.tabla === t).map((x) => x.op));

const hallDeArchivo = (p) => HALL.filter((h) => h.archivo === p);
const epsDeArchivo = (p) => EPS.filter((e) => e.frontend.some((r) => r.archivo === p) || e.pasos.some((s) => s.archivo === p) || e.entrada?.archivo === p);
const hallDeTabla = (t) => HALL.filter((h) => h.tabla === t);
const peorSev = (hs) => (hs.length ? hs.reduce((m, h) => (SEV[h.severidad] < SEV[m] ? h.severidad : m), "baja") : null);
const hallDeRango = (archivo, desde, hasta) => HALL.filter((h) => h.archivo === archivo && h.desde <= hasta && h.hasta >= desde);

// fuentes comprimidas con gzip dentro del HTML
let FUENTES = {};
async function cargarFuentes() {
  if (!A.fuentesGz) return;
  const bin = Uint8Array.from(atob(A.fuentesGz), (c) => c.charCodeAt(0));
  const flujo = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  FUENTES = JSON.parse(await new Response(flujo).text());

}

const hEp = (id, tab = "recorrido", paso) => `endpoint/${encodeURIComponent(id)}/${tab}` + (paso != null ? `?paso=${paso}` : "");

}
const preguntaClaude = (h) => `En ${A.proyecto?.nombre || "este repo"}, ${h.archivo}:${h.desde}-${h.hasta} hay un problema: "${h.titulo}". ` +
  `Explicame paso a paso por qué es un problema, mostrame con el código real cómo se reproduciría y proponé el arreglo mínimo con su test.`;

// ───────────────────────── íconos ─────────────────────────
const P = {
  atlas: "M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.6 3.7L12 11.7 5.4 8 12 4.3ZM5 9.7l6 3.4v6.6l-6-3.4V9.7Zm8 10v-6.6l6-3.4v6.6l-6 3.4Z",
  frontend: "M3 4h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm1 2v9h16V6H4Z",
  backend: "M4 3h16a1 1 0 0 1 1 1v6H3V4a1 1 0 0 1 1-1Zm-1 9h18v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6Zm3-6v2h2V6H6Zm0 9v2h2v-2H6Z",
  db: "M12 2c4.4 0 8 1.6 8 3.5v13c0 1.9-3.6 3.5-8 3.5s-8-1.6-8-3.5v-13C4 3.6 7.6 2 12 2Zm6 6.1C16.5 9 14.4 9.5 12 9.5S7.5 9 6 8.1V12c0 .5 2.2 1.5 6 1.5s6-1 6-1.5V8.1Zm0 6.5c-1.5.9-3.6 1.4-6 1.4s-4.5-.5-6-1.4v3.9c0 .5 2.2 1.5 6 1.5s6-1 6-1.5v-3.9ZM12 4C8.2 4 6 5 6 5.5S8.2 7 12 7s6-1 6-1.5S15.8 4 12 4Z",
  api: "M8 5 2 12l6 7 1.5-1.3L4.6 12l4.9-5.7L8 5Zm8 0-1.5 1.3 4.9 5.7-4.9 5.7L16 19l6-7-6-7Z",
  file: "M6 2h8l6 6v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Zm7 1.5V9h5.5L13 3.5Z",
  alerta: "M12 2 1 21h22L12 2Zm0 4.5L19.5 19h-15L12 6.5ZM11 10v5h2v-5h-2Zm0 6v2h2v-2h-2Z",
  lock: "M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h1Zm2 0h6V7a3 3 0 0 0-6 0v3Z",
  abierto: "M7 10V7a5 5 0 0 1 9.6-2l-1.8.9A3 3 0 0 0 9 7v3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h1Z",
  buscar: "M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z",
  sol: "M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm-1-5h2v3h-2V2Zm0 17h2v3h-2v-3ZM2 11h3v2H2v-2Zm17 0h3v2h-3v-2ZM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1Zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1Zm2.1-13.5 1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1ZM6.3 16.3l1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1Z",
  flecha: "M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2l-4.6-4.6L13 5Z",
  atras: "M11 5l-7 7 7 7 1.4-1.4L7.8 13H20v-2H7.8l4.6-4.6L11 5Z",
  copiar: "M8 3h11a1 1 0 0 1 1 1v13h-2V5H8V3ZM4 7h11a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Zm1 2v11h9V9H5Z",
  pregunta: "M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm-1 11h2v2h-2v-2Zm1-9a3.5 3.5 0 0 1 1.3 6.7c-.3.2-.3.3-.3.5V14h-2v-.8c0-1.1.6-1.8 1.4-2.2A1.5 1.5 0 1 0 10.5 9.5h-2A3.5 3.5 0 0 1 12 6Z",
};
const Ic = ({ n, s = 16 }) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d=${P[n]} /></svg>`;
const ICONO_NAC = { frontend: "frontend", backend: "backend", db: "db", infra: "file" };

// ───────────────────────── resaltado de código ─────────────────────────
const KW = {
  py: "def class return if elif else for while in not and or is import from as with try except finally raise pass yield async await lambda None True False self",
  ts: "import from export default const let var function return if else for while of in new await async try catch finally throw class extends type interface as typeof null undefined true false",
  java: "public private protected class interface enum return if else for while new try catch finally throw throws static final void extends implements import package this null true false",
};
const LANG = (p) => (/\.py$/.test(p) ? "py" : /\.(t|j)sx?$|\.mjs$/.test(p) ? "ts" : /\.java$/.test(p) ? "java" : "");
const RE_CACHE = {};
function reLang(l) {
  if (RE_CACHE[l]) return RE_CACHE[l];
  const com = l === "py" || l === "" ? "#.*$" : "\\/\\/.*$";
  const kw = KW[l] ? `\\b(?:${KW[l].split(" ").join("|")})\\b` : "(?!)";
  return (RE_CACHE[l] = new RegExp(`(${com})|("(?:\\\\.|[^"\\\\])*"|'(?:\\\\.|[^'\\\\])*'|\`(?:\\\\.|[^\`\\\\])*\`)|(@\\w+)|(${kw})|\\b(\\d+(?:\\.\\d+)?)\\b|(<\\/?[A-Z][\\w.]*)`, "g"));
}
function colorear(linea, l) {
  const out = [];
  let i = 0;
  const re = reLang(l);
  re.lastIndex = 0;
  for (let m; (m = re.exec(linea)); ) {
    if (m.index > i) out.push(linea.slice(i, m.index));
    const cls = m[1] ? "sc" : m[2] ? "ss" : m[3] ? "sd" : m[4] ? "sk" : m[5] ? "sn" : "st";
    out.push(html`<span class=${cls}>${m[0]}</span>`);
    i = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  if (i < linea.length) out.push(linea.slice(i));
  return out;
}

// ───────────────────────── componentes comunes ─────────────────────────
const Metodo = ({ m, grande }) => html`<span class=${"metodo " + m + (grande ? " grande" : "")}>${m}</span>`;

function Codigo({ archivo, desde, hasta, contexto = 3, completo: completoIni = false, titulo, sev }) {
  const [completo, setCompleto] = useState(completoIni);
  const ref = useRef();
  const txt = FUENTES[archivo];
  useLayoutEffect(() => {
    if (completo && ref.current && desde) {
      const el = ref.current.querySelector(`[data-l="${desde}"]`);

  }, [completo, archivo, desde]);
  if (txt == null) return html`<div class="codigo"><div class="codigo-cab"><span class="ruta">${archivo}</span></div><p class="vacio" style="padding:10px 14px;margin:0">Código no incluido en el atlas.</p></div>`;

  const ini = completo || !desde ? 1 : Math.max(1, d - contexto);
  const fin = completo || !desde ? lineas.length : Math.min(lineas.length, h + contexto);
  const errores = HALL.filter((x) => x.archivo === archivo && x.desde);
  const claseLinea = (n) => {
    if (desde && n >= d && n <= h) return sev ? "ln err " + sev : "ln sel";
    const e = (completo || !desde) && errores.find((x) => n >= x.desde && n <= x.hasta);
    return e ? "ln err " + e.severidad : "ln";
  };
  const filas = [];
  if (ini > 1) filas.push(html`<span class="salto">⋯ ${ini - 1} líneas arriba</span>`);
  for (let n = ini; n <= fin; n++) filas.push(html`<span class=${claseLinea(n)} data-l=${n}><i>${n}</i>${colorear(lineas[n - 1], l)}${"\n"}</span>`);
  if (fin < lineas.length) filas.push(html`<span class="salto">⋯ ${lineas.length - fin} líneas abajo</span>`);
  return html`<div class="codigo">

function relacionados(foco) {
  if (!foco) return null;
  const s = new Set([foco]);
  const conEp = (e) => { s.add("e:" + e.id); e.pantallas.forEach((p) => s.add("p:" + p)); e.clientes.forEach((c) => s.add("c:" + c)); e.tbs.forEach((t) => s.add("t:" + t)); e.backend.forEach((b) => s.add("b:" + b)); };
  const conRota = (r) => { s.add("r:" + r.id); s.add("c:" + r.archivo); r.usadoEn.forEach((u) => s.add("p:" + u.archivo)); };
  const [tipo, ...resto] = foco.split(":");
  const id = resto.join(":");
  if (tipo === "e") conEp(EP.get(id));
  if (tipo === "p") { EPS.filter((e) => e.pantallas.includes(id)).forEach((e) => { conEp(e); }); ROTAS.filter((r) => r.usadoEn.some((u) => u.archivo === id)).forEach(conRota);
    // de una pantalla solo interesa esa pantalla, no las otras que llaman a los mismos endpoints
    for (const x of [...s]) if (x.startsWith("p:") && x !== foco) s.delete(x); }
  if (tipo === "c") { EPS.filter((e) => e.clientes.includes(id)).forEach(conEp); ROTAS.filter((r) => r.archivo === id).forEach(conRota); }
  if (tipo === "t") EPS.filter((e) => e.tbs.includes(id)).forEach(conEp);
  if (tipo === "r") conRota(ROTAS.find((r) => r.id === id));
  if (tipo === "b") EPS.filter((e) => e.backend.includes(id)).forEach(conEp);
  return s;
}

const CABLES = (() => {
  const out = [], visto = new Set();
  const add = (de, a, et, roto) => { const k = de + ">" + a; if (!visto.has(k)) { visto.add(k); out.push({ de, a, et, roto }); } };
  for (const e of EPS) {
    for (const c of e.clientes) add("c:" + c, "e:" + e.id);
    for (const p of e.pantallas) for (const c of e.clientes) add("p:" + p, "c:" + c);
    for (const t of e.tbs) add("e:" + e.id, "t:" + t, opsDe(e, t).join(" · "));
  }
  for (const r of ROTAS) { add("c:" + r.archivo, "r:" + r.id, "", true); for (const u of r.usadoEn) add("p:" + u.archivo, "c:" + r.archivo); }
  return out;
})();

function Mapa({ q }) {
  const sel = q.get("sel");
  const [hover, setHover] = useState(null);
  const foco = hover || sel;
  const rel = useMemo(() => relacionados(foco), [foco]);
  const plano = useRef();
  const lateral = useRef();
  useEffect(() => { if (lateral.current) lateral.current.scrollTop = 0; }, [foco]);
  const [geo, setGeo] = useState({ pos: {}, w: 0, h: 0 });

  const medir = () => {
    const el = plano.current;
    if (!el) return;
    const R = el.getBoundingClientRect(), pos = {};
    el.querySelectorAll("[data-n]").forEach((n) => {
      const r = n.getBoundingClientRect();
      pos[n.dataset.n] = { x1: r.left - R.left, x2: r.right - R.left, y: r.top - R.top + r.height / 2 };
    });
    setGeo({ pos, w: el.scrollWidth, h: el.scrollHeight });
  };
  useLayoutEffect(() => {
    medir();
    const ro = new ResizeObserver(medir);
    ro.observe(plano.current);
    return () => ro.disconnect();
  }, []);
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape" && sel) ir("mapa"); };
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, [sel]);

  const elegir = (id) => ir(sel === id ? "mapa" : "mapa?sel=" + encodeURIComponent(id));
  const estado = (id) => (foco === id ? " foco" : rel && !rel.has(id) ? " tenue" : "");
  const props = (id, extra = "") => ({ "data-n": id, class: "nodo" + extra + estado(id), onClick: () => elegir(id), onMouseEnter: () => setHover(id), onMouseLeave: () => setHover(null), onFocus: () => setHover(id), onBlur: () => setHover(null) });

  const pantallas = Object.keys(ARCH).filter((p) => capaDe(p) === "pagina");
  const clientes = Object.keys(ARCH).filter((p) => capaDe(p) === "cliente-api");
  const internos = Object.keys(ARCH).filter((p) => ["service", "repository", "seguridad"].includes(capaDe(p)));
  const etiquetas = uniq(EPS.map((e) => e.etiqueta || "Otros"));

  const cables = CABLES.map((c) => {
    const p = geo.pos[c.de], q2 = geo.pos[c.a];
    if (!p || !q2) return null;
    const activo = rel && rel.has(c.de) && rel.has(c.a);
    const x1 = p.x2, x2 = q2.x1 - 3, dx = Math.max(24, (x2 - x1) / 2);
    const d = `M${x1},${p.y} C${x1 + dx},${p.y} ${x2 - dx},${q2.y} ${x2},${q2.y}`;
    return html`<g key=${c.de + c.a}>
      <path class=${"cable" + (c.roto ? " roto" : "") + (activo ? " activo" : "")} d=${d} marker-end=${activo ? "url(#pa)" : ""} />
      ${activo && c.et && html`<text class="cable-et" x=${x1 + 6} y=${p.y - 6}>${c.et}</text>`}
    </g>`;
  });

  return html`<div class="mapa">
    <div class="lienzo">
      <div class="leyenda-mapa">
        <span>Pasá el mouse o tocá cualquier pieza para ver con qué se conecta.</span>
        <span><span class="punto alta"></span>tiene hallazgos</span>
        <span><span class="sin-uso">sin uso</span>nadie lo llama</span>
        <span><svg width="26" height="8"><path d="M0,4 H26" stroke="var(--alta)" stroke-dasharray="5 4" stroke-width="1.5" /></svg>llamada rota</span>
      </div>
      <div class="plano" ref=${plano}>
        <svg class="cables" width=${geo.w} height=${geo.h}>
          <defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)" /></marker></defs>
          ${cables}
        </svg>

        <section class="nacion doble nac-frontend">
          <div class="nacion-cab"><div class="ic"><${Ic} n="frontend" s=${18} /></div><div><h2>${NAC.frontend?.nombre || "Frontend"}</h2><small>${NAC.frontend?.tipo}</small></div></div>
          <div>
            <div class="grupo-t">Pantallas</div>
            ${pantallas.map((p) => { const hs = hallDeArchivo(p); return html`<button ...${props("p:" + p)}>
              <div class="txt"><div class="nom">${base(p).replace(/\.\w+$/, "")}</div><div class="sub">${ARCH[p]?.rol}</div></div>
              ${hs.length > 0 && html`<span class=${"punto " + peorSev(hs)}></span>`}
            </button>`; })}
          </div>
          <div>
            <div class="grupo-t">Cliente API</div>
            ${clientes.map((c) => { const hs = hallDeArchivo(c); return html`<button ...${props("c:" + c)}>
              <div class="txt"><div class="nom mono">${base(c)}</div><div class="sub">${ARCH[c]?.rol}</div></div>
              ${hs.length > 0 && html`<span class=${"punto " + peorSev(hs)}></span>`}
            </button>`; })}
          </div>
        </section>

        <section class="nacion nac-backend">
          <div class="nacion-cab"><div class="ic"><${Ic} n="backend" s=${18} /></div><div><h2>${NAC.backend?.nombre || "Backend"}</h2><small>${NAC.backend?.tipo}</small></div></div>
          ${etiquetas.map((et) => html`
            <div class="grupo-t">${et}</div>
            ${EPS.filter((e) => (e.etiqueta || "Otros") === et).map((e) => html`<button ...${props("e:" + e.id)} title=${e.resumen}>
              <${Metodo} m=${e.metodo} />
              <span class="ruta-ep">${e.ruta}</span>
              <span class="marcas">
                ${!e.frontend.length && html`<span class="sin-uso">sin uso</span>`}
                ${e.auth ? html`<${Ic} n="lock" s=${12} />` : null}
                ${e.hall.length > 0 && html`<span class=${"punto " + peorSev(e.hall)}></span>`}
              </span>
            </button>`)}`)}
          ${ROTAS.length > 0 && html`<div class="grupo-t" style="color:var(--alta)">Llamadas a rutas que no existen</div>
            ${ROTAS.map((r) => html`<button ...${props("r:" + r.id, " fantasma")} title="El frontend llama a esta ruta, pero el backend no la tiene">
              <${Metodo} m=${r.metodo} /><span class="ruta-ep">${r.ruta}</span><span class="punto alta"></span>
            </button>`)}`}
          ${internos.length > 0 && html`<div class="grupo-t">Por dentro</div>
            <div class="internos">${internos.map((b) => html`<span data-b=${b} class=${"interno" + (rel ? (rel.has("b:" + b) ? " foco" : " tenue") : "")} title=${ARCH[b]?.rol}>${base(b)}</span>`)}</div>`}
        </section>

        <section class="nacion nac-db">
          <div class="nacion-cab"><div class="ic"><${Ic} n="db" s=${18} /></div><div><h2>${NAC.db?.nombre || "Base de datos"}</h2><small>${NAC.db?.tipo}</small></div></div>
          <div class="grupo-t">Tablas</div>
          ${TABLAS.map((t) => { const hs = hallDeTabla(t.nombre); const usos = usosTabla(t.nombre).length; return html`<button ...${props("t:" + t.nombre)}>
            <div class="txt"><div class="nom mono">${t.nombre}</div><div class="sub">${t.campos.length} campos · ${usos} endpoint${usos === 1 ? "" : "s"}</div></div>
            ${hs.length > 0 && html`<span class=${"punto " + peorSev(hs)}></span>`}
          </button>`; })}
        </section>
      </div>
    </div>
    <aside class="lateral" ref=${lateral}>${foco ? html`<${Detalle} id=${foco} fijo=${!!sel && foco === sel} />` : html`<${Bienvenida} />`}</aside>
  </div>`;
}

    <div class="chips"><a class="btn" href=${href(hArch(p))}>Ver archivo completo</a></div>
    ${eps.length > 0 && html`<div class="etq" style="margin-top:20px">Endpoints que usa (${eps.length})</div>
      <div class="participa"><div class="bloque nac-backend"><ul>${eps.map((e) => html`<li><${Metodo} m=${e.metodo} /><a href=${href(hEp(e.id))} class="mono" style="font-size:12px">${e.ruta}</a></li>`)}</ul></div></div>`}
    ${ROTAS.filter((r) => r.archivo === p || r.usadoEn.some((u) => u.archivo === p)).map((r) => html`<div class="etq">Llamada rota</div><${DetalleRota} r=${r} />`)}
    ${hs.length > 0 && html`<div class="etq">Hallazgos (${hs.length})</div>${hs.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} compacto />`)}`}
  </div>`;
}

// ───────────────────────── Endpoints ─────────────────────────
function Endpoints({ q }) {
  const [texto, setTexto] = useState("");
  const [metodo, setMetodo] = useState("");
  const [soloHall, setSoloHall] = useState(false);
  const etq = q.get("etiqueta") || "";
  const etiquetas = uniq(EPS.map((e) => e.etiqueta || "Otros"));
  const lista = EPS.filter((e) => (!etq || (e.etiqueta || "Otros") === etq) && (!metodo || e.metodo === metodo) && (!soloHall || e.hall.length)
    && (!texto || (e.ruta + " " + e.resumen).toLowerCase().includes(texto.toLowerCase())));
  return html`<div class="pagina">
    <div class="pagina-titulo"><div><h1>Endpoints</h1><p>Todo lo que expone el backend. Tocá uno para ver su recorrido completo.</p></div></div>
    <div class="filtros">
      <input placeholder="Buscar ruta o descripción…" value=${texto} onInput=${(e) => setTexto(e.target.value)} />
      <div class="seg">${["", "GET", "POST", "PUT", "PATCH", "DELETE"].filter((m) => !m || EPS.some((e) => e.metodo === m)).map((m) => html`<button class=${metodo === m ? "on" : ""} onClick=${() => setMetodo(m)}>${m || "Todos"}</button>`)}</div>
      <label class="chip" style="cursor:pointer"><input type="checkbox" checked=${soloHall} onChange=${(e) => setSoloHall(e.target.checked)} /> Solo con hallazgos</label>
    </div>
    <div class="lado">
      <nav>
        <button class=${!etq ? "on" : ""} onClick=${() => ir("endpoints")}><span>Todos</span><span>${EPS.length}</span></button>
        ${etiquetas.map((t) => html`<button class=${etq === t ? "on" : ""} onClick=${() => ir("endpoints?etiqueta=" + encodeURIComponent(t))}><span>${t}</span><span>${EPS.filter((e) => (e.etiqueta || "Otros") === t).length}</span></button>`)}
      </nav>
      <div class="card" style="padding:6px 10px;overflow-x:auto">
        <table class="tabla">
          <thead><tr><th>Método</th><th>Endpoint</th><th>Descripción</th><th>Frontend</th><th>Auth</th><th></th></tr></thead>
          <tbody>${lista.map((e) => html`<tr class="click" onClick=${() => ir(hEp(e.id))}>
            <td><${Metodo} m=${e.metodo} /></td>
            <td class="ruta-cel">${e.ruta}</td>
            <td>${e.resumen}</td>
            <td>${e.frontend.length ? html`<span class="muted">${e.pantallas.map((p) => base(p).replace(/\.\w+$/, "")).join(", ") || base(e.clientes[0])}</span>` : html`<span class="sin-uso">sin uso</span>`}</td>
            <td title=${e.auth ? "Requiere " + e.auth : "Público"}>${e.auth ? html`<${Ic} n="lock" s=${14} />` : html`<span style="color:var(--media)"><${Ic} n="abierto" s=${14} /></span>`}</td>
            <td>${e.hall.length > 0 && html`<span class=${"sev " + peorSev(e.hall)}>${e.hall.length}</span>`}</td>
          </tr>`)}</tbody>
        </table>
        ${!lista.length && html`<p class="vacio" style="padding:10px">Ningún endpoint coincide con los filtros.</p>`}
      </div>
    </div>
  </div>`;
}

function capaPaso(p) {
  if (p.tabla) return { nac: "db", capa: "Base de datos" };
  return { nac: nacionDe(p.archivo), capa: CAPA_TXT[capaDe(p.archivo)] || capaDe(p.archivo) || "Código" };
}

function EndpointDetalle({ id, tab, q }) {
  const e = EP.get(id);
  if (!e) return html`<div class="pagina"><p class="vacio">No existe el endpoint ${id}.</p></div>`;
  const tabs = [["recorrido", "Recorrido paso a paso"], ["resumen", "Resumen"], ["archivos", `Archivos (${uniq(e.pasos.filter((p) => p.archivo).map((p) => p.archivo)).length})`], ["hallazgos", `Hallazgos (${e.hall.length})`]];
  return html`<div class="pagina">
    <a class="volver" href=${href(FOCO ? "foco" : "endpoints")}><${Ic} n="atras" s=${14} /> ${FOCO ? "Antes de tocarlo" : "Endpoints"}</a>

    <p style="margin:8px 0 10px">${e.resumen}</p>
    <div class="chips"><${Auth} e=${e} />${e.etiqueta && html`<span class="chip">${e.etiqueta}</span>`}${!e.frontend.length && html`<span class="sin-uso">ninguna pantalla lo usa</span>`}${e.hall.length > 0 && html`<span class=${"sev " + peorSev(e.hall)}>${e.hall.length} hallazgo${e.hall.length > 1 ? "s" : ""}</span>`}
      <button class="btn" onClick=${() => copiar(contextoFix(e))}><${Ic} n="copiar" s=${13} /> Copiar contexto para un fix</button></div>

    ${tab === "recorrido" && html`<${Recorrido} e=${e} paso=${parseInt(q.get("paso") || "0", 10) || 0} />`}
    ${tab === "resumen" && html`<${EndpointResumen} e=${e} />`}
    ${tab === "archivos" && html`<${EndpointArchivos} e=${e} />`}
    ${tab === "hallazgos" && (e.hall.length ? e.hall.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} abierto />`) : html`<p class="vacio">Sin hallazgos en este endpoint.</p>`)}
  </div>`;
}

function Recorrido({ e, paso }) {
  const pasos = e.pasos;
  const i = Math.min(Math.max(0, paso), pasos.length - 1);
  const p = pasos[i];
  const irPaso = (n) => ir(hEp(e.id, "recorrido", n));
  useEffect(() => {
    const k = (ev) => {
      if (ev.target.matches("input, textarea, select")) return;
      if (ev.key === "ArrowRight" && i < pasos.length - 1) irPaso(i + 1);
      if (ev.key === "ArrowLeft" && i > 0) irPaso(i - 1);
    };
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, [i, e.id]);
  if (!p) return html`<p class="vacio">Este endpoint no tiene recorrido cargado.</p>`;
  const { nac, capa } = capaPaso(p);
  const hs = p.archivo ? hallDeRango(p.archivo, p.desde, p.hasta) : [];
  const t = p.tabla && TB.get(p.tabla);
  return html`<div>
    <div class="stepper">
      ${pasos.map((s, j) => { const c = capaPaso(s); const alerta = s.archivo && hallDeRango(s.archivo, s.desde, s.hasta).length; return html`
        ${j > 0 && html`<div class="sep"><${Ic} n="flecha" s=${16} /></div>`}
        <button class=${`paso nac-${c.nac}` + (j === i ? " on" : j < i ? " hecho" : "")} onClick=${() => irPaso(j)}>
          <span class="n">${j + 1}</span><span class="capa">${c.capa}</span>
          ${alerta ? html`<span class="alerta punto ${peorSev(hallDeRango(s.archivo, s.desde, s.hasta))}"></span>` : null}
          <span class="que">${s.accion}</span>
          <span class="arch">${s.tabla ? "tabla " + s.tabla : base(s.archivo) + ":" + s.desde}</span>
        </button>`; })}
    </div>
    <div class="card paso-det" style="margin-top:6px">
      <div class="chips"><${ChipNac} n=${nac} /><span class="chip">${capa}</span><span class="muted" style="font-size:12px">Paso ${i + 1} de ${pasos.length}</span></div>
      <div class="accion" style="margin-top:8px">${p.accion}</div>
      ${p.explicacion && html`<p style="margin:6px 0 0">${p.explicacion}</p>`}
      ${p.pregunta && html`<div class="pregunta"><b>Para pensar</b>${p.pregunta}</div>`}
      ${hs.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} compacto />`)}
      ${p.archivo && html`<${Codigo} key=${p.archivo + p.desde} archivo=${p.archivo} desde=${p.desde} hasta=${p.hasta} />`}
      ${t && html`<div style="margin-top:10px">
        <div class="chips"><span class="op">${p.op}</span><a class="mono" href=${href(hTabla(t.nombre))}>${t.nombre}</a><span class="muted">${t.resumen}</span></div>
        <table class="tabla" style="margin-top:8px"><tbody>${t.campos.map((c) => html`<tr><td class="mono">${c.nombre}</td><td class="muted mono">${c.tipo}</td><td>${c.desc}</td></tr>`)}</tbody></table>
      </div>`}
      <div class="paso-nav">
        <button class="btn" disabled=${i === 0} onClick=${() => irPaso(i - 1)}><${Ic} n="atras" s=${14} /> Anterior</button>
        <span class="muted" style="font-size:12px">← → para avanzar</span>
        <button class="btn primario" disabled=${i === pasos.length - 1} onClick=${() => irPaso(i + 1)}>Siguiente <${Ic} n="flecha" s=${14} /></button>
      </div>
    </div>
  </div>`;
}

function EndpointResumen({ e }) {
  return html`<div class="grid dos">
    <div>
      <div class="card">
        <h3>Qué hace</h3>
        <p style="margin:0 0 14px">${e.explicacion}</p>
        <dl class="info">
          <dt>Método</dt><dd><${Metodo} m=${e.metodo} /></dd>

        </dl>
      </div>
      ${e.entrada && html`<div class="card" style="margin-top:16px"><h3>Datos de entrada</h3><${Codigo} archivo=${e.entrada.archivo} desde=${e.entrada.desde} hasta=${e.entrada.hasta} contexto=${0} /></div>`}

function EndpointArchivos({ e }) {
  const filas = [];
  const visto = new Set();
  for (const p of [...e.frontend, ...e.pasos]) {
    if (!p.archivo || visto.has(p.archivo + p.desde)) continue;
    visto.add(p.archivo + p.desde);
    filas.push(p);
  }
  return html`<div class="card" style="padding:6px 10px;overflow-x:auto"><table class="tabla">
    <thead><tr><th>Archivo</th><th>Nación</th><th>Rol</th><th>Líneas</th></tr></thead>
    <tbody>${filas.map((p) => html`<tr class="click" onClick=${() => ir(hArch(p.archivo, p.desde))}>
      <td><span class="mono">${p.archivo}</span>${p.simbolo && html`<div class="muted mono" style="font-size:12px">${p.simbolo}()</div>`}</td>
      <td><${ChipNac} n=${nacionDe(p.archivo)} /></td>
      <td>${ARCH[p.archivo]?.rol}</td>
      <td class="mono muted">${p.desde}–${p.hasta}</td>
    </tr>`)}</tbody>
  </table></div>`;
}

// ───────────────────────── Base de datos ─────────────────────────

// ───────────────────────── Archivos ─────────────────────────
function Archivos({ ruta, q }) {
  const todos = ARCHIVOS();
  const actual = ruta && todos.includes(ruta) ? ruta : null;
  const linea = parseInt(q.get("l") || "0", 10) || null;
  const porNac = {};
  for (const p of todos) (porNac[nacionDe(p)] ||= []).push(p);
  const orden = ["frontend", "backend", "db", "infra"].filter((n) => porNac[n]);
  const ref = actual ? epsDeArchivo(actual) : [];
  const hs = actual ? hallDeArchivo(actual) : [];
  const sim = actual && linea ? [...EPS.flatMap((e) => [...e.frontend, ...e.pasos]), ...HALL].find((r) => r.archivo === actual && r.desde === linea) : null;
  return html`<div class="pagina">
    <div class="pagina-titulo"><div><h1>Archivos</h1><p>Qué hace cada archivo y en qué endpoints participa.</p></div></div>
    <div class="lado" style="grid-template-columns:280px minmax(0,1fr)">
      <div class="card arbol" style="padding:10px">
        ${orden.map((n) => {
          const dirs = {};
          for (const p of porNac[n]) (dirs[p.split("/").slice(0, -1).join("/") || "."] ||= []).push(p);
          return html`<div class=${"nac-t nac-" + n}><span class="chip nac">${NAC[n]?.nombre || "Infraestructura"}</span></div>
            ${Object.entries(dirs).map(([d, ps]) => html`<div class="dir">${d}/</div>${ps.map((p) => { const h = hallDeArchivo(p); return html`<button class=${p === actual ? "on" : ""} onClick=${() => ir(hArch(p))}>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${base(p)}</span>${h.length > 0 && html`<span class=${"punto " + peorSev(h)}></span>`}</button>`; })}`)}`;
        })}
      </div>
      <div>
        ${!actual ? html`<div class="card"><p class="vacio" style="margin:0">Elegí un archivo de la lista.</p></div>` : html`
          <div class="card">
            <div class="chips" style="margin-bottom:6px"><${ChipNac} n=${nacionDe(actual)} />${capaDe(actual) && html`<span class="chip">${CAPA_TXT[capaDe(actual)] || capaDe(actual)}</span>`}</div>
            <h2 class="mono" style="font-size:17px;word-break:break-all">${actual}</h2>
            <p style="margin:6px 0 0">${ARCH[actual]?.rol || html`<span class="vacio">Sin explicación todavía.</span>`}</p>
            ${ref.length > 0 && html`<div class="etq">Participa en</div><div class="chips">${ref.map((e) => html`<a class="chip" href=${href(hEp(e.id))}><${Metodo} m=${e.metodo} /> <span class="mono">${e.ruta}</span></a>`)}</div>`}
          </div>
          ${hs.length > 0 && html`<div class="etq" style="margin-top:20px">Hallazgos en este archivo</div>${hs.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} compacto />`)}`}
          <div class="etq" style="margin-top:20px">Código${sim?.simbolo ? html` · <span class="mono" style="text-transform:none">${sim.simbolo}</span>` : ""}</div>
          <${Codigo} key=${actual + linea} archivo=${actual} desde=${linea || undefined} hasta=${sim?.hasta || linea || undefined} completo />`}
      </div>
    </div>
  </div>`;
}

// ───────────────────────── Hallazgos ─────────────────────────
function Hallazgos({ abierto }) {
  const [sev, setSev] = useState("");
  const [origen, setOrigen] = useState("");
  const lista = HALL.filter((h) => (!sev || h.severidad === sev) && (!origen || h.origen === origen));
  return html`<div class="pagina">
    <div class="pagina-titulo"><div><h1>Hallazgos</h1><p>Problemas detectados en el código: qué pasa, dónde está y cómo arreglarlo.</p></div></div>
    <div class="contadores">
      ${["", "alta", "media", "baja"].map((s) => html`<button class=${"contador" + (sev === s ? " on" : "")} onClick=${() => setSev(s)}>
        ${s ? html`<span class=${"punto " + s}></span>` : null}<b>${s ? HALL.filter((h) => h.severidad === s).length : HALL.length}</b><span class="muted">${s ? SEV_TXT[s] : "Todos"}</span></button>`)}
    </div>
    <div class="filtros">
      <div class="seg">${[["", "Todos"], ["script", "Detectados por el script"], ["agente", "Detectados por el agente"]].map(([o, n]) => html`<button class=${origen === o ? "on" : ""} onClick=${() => setOrigen(o)}>${n}</button>`)}</div>
      <span class="muted" style="font-size:12.5px">El script encuentra problemas mecánicos (rutas sin auth, llamadas rotas). El agente encuentra los de criterio (N+1, lógica fuera de lugar).</span>
    </div>
    ${lista.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} abierto=${h.id === abierto} />`)}
    ${!lista.length && html`<p class="vacio">Ningún hallazgo con esos filtros.</p>`}
  </div>`;
}

// ───────────────────────── Foco: un solo endpoint ─────────────────────────
function contextoFix(e) {
  const l = [`Quiero hacer un cambio chico en ${A.proyecto?.nombre || "este repo"}, en el endpoint ${e.id}.`, "", "Recorrido actual:"];
  e.pasos.forEach((p, i) => l.push(p.tabla
    ? `${i + 1}. tabla ${p.tabla} (${p.op}): ${p.accion}`
    : `${i + 1}. ${p.archivo}:${p.desde}-${p.hasta}${p.simbolo ? " " + p.simbolo + "()" : ""}: ${p.accion}`));
  if (e.tbs.length) l.push("", "Tablas: " + e.tbs.map((t) => `${t} (${opsDe(e, t).join(", ")})`).join(", "));
  const imp = (FOCO?.impacto || []).filter((x) => x.endpoints.length);
  if (imp.length) l.push("", "Piezas que comparte con otras rutas:", ...imp.map((x) => `- ${x.simbolo}() también la usan ${x.endpoints.join(", ")}`));
  const hs = FOCO ? HALL : e.hall;
  if (hs.length) l.push("", "Problemas conocidos en este camino:", ...hs.map((h) => `- [${h.severidad}] ${h.titulo} (${h.archivo}:${h.desde})`));
  if (e.tests && !e.tests.length) l.push("", "Ningún test cubre este endpoint.");
  l.push("", "Lo que quiero cambiar: <describilo acá>", "",
    "Antes de editar, leé esos archivos, decime qué tocarías y qué podría romperse, y escribí primero un test que reproduzca el problema.");
  return l.join("\n");
}

function VistaFoco() {
  const e = EP.get(FOCO.endpoint);
  const back = e.pasos.map((p, i) => ({ ...p, i })).filter((p) => p.archivo && nacionDe(p.archivo) === "backend");
  const imp = (p) => (FOCO.impacto || []).find((x) => x.archivo === p.archivo && x.simbolo === p.simbolo);
  const compartidas = (FOCO.tablas || []).filter((t) => t.endpoints.length);
  return html`<div class="pagina">
    <div class="foco-aviso"><${Ic} n="buscar" s=${14} /><span>Vista de un solo endpoint: se analizó 1 de ${FOCO.total_endpoints} endpoints y ${ARCHIVOS().length} de ${FOCO.total_archivos} archivos.</span></div>
    <div class="ep-cab"><${Metodo} m=${e.metodo} grande /><h1>${e.ruta}</h1></div>
    <p style="margin:8px 0 10px">${e.explicacion || e.resumen}</p>
    <div class="chips"><${Auth} e=${e} />${HALL.length > 0 && html`<a class=${"sev " + peorSev(HALL)} href=${href("hallazgos")} style="text-decoration:none">${HALL.length} problema${HALL.length > 1 ? "s" : ""} en el camino</a>`}</div>

    <div class="grid dos" style="margin-top:20px">
      <div class="cadena">
        <section class="banda nac-frontend">
          <div class="banda-t"><${Ic} n="frontend" s=${15} /> Frontend: quién lo llama</div>
          ${e.frontend.length ? e.frontend.map((r) => html`<a class="eslabon" href=${href(hArch(r.archivo, r.desde))}>
            <div class="txt"><div class="mono">${base(r.archivo)}</div>${r.simbolo && html`<div class="muted small mono">${r.simbolo}()</div>`}</div>
            ${hallDeRango(r.archivo, r.desde, r.hasta).length > 0 && html`<span class=${"punto " + peorSev(hallDeRango(r.archivo, r.desde, r.hasta))}></span>`}
            <span class="l">:${r.desde}</span></a>`) : html`<p class="vacio small" style="margin:6px 0 0">Ninguna pantalla lo llama.</p>`}
        </section>
        <div class="conector">↓ HTTP ${e.metodo} ${e.ruta}</div>
        <section class="banda nac-backend">
          <div class="banda-t"><${Ic} n="backend" s=${15} /> Backend: por dónde pasa</div>
          ${back.map((p) => { const x = imp(p); const hs = hallDeRango(p.archivo, p.desde, p.hasta); return html`<a class="eslabon" href=${href(hEp(e.id, "recorrido", p.i))}>
            <span class="num">${p.i + 1}</span>
            <div class="txt"><div><b>${p.accion}</b></div><div class="muted small mono">${base(p.archivo)} · ${p.simbolo || ""}()</div></div>
            ${hs.length > 0 && html`<span class=${"punto " + peorSev(hs)}></span>`}
            ${x?.endpoints.length > 0 && html`<span class="chip comparte" title=${"También la usan: " + x.endpoints.join(", ")}>+${x.endpoints.length} ruta${x.endpoints.length > 1 ? "s" : ""}</span>`}
          </a>`; })}
        </section>
        <div class="conector">↓ SQL</div>
        <section class="banda nac-db">
          <div class="banda-t"><${Ic} n="db" s=${15} /> Base de datos: qué toca</div>
          ${e.tbs.length ? e.tbs.map((t) => html`<a class="eslabon" href=${href(hTabla(t))}><span class="mono" style="flex:1">${t}</span>${opsDe(e, t).map((o) => html`<span class="op">${o}</span>`)}</a>`) : html`<p class="vacio small" style="margin:6px 0 0">No toca la base.</p>`}
        </section>
        <div class="chips" style="margin-top:14px"><a class="btn primario" href=${href(hEp(e.id))}>Ver recorrido paso a paso <${Ic} n="flecha" s=${14} /></a></div>
      </div>

      <div style="min-width:0">
        <div class="card">
          <h3>Antes de tocarlo</h3>
          <div class="etq">Si cambiás estas funciones</div>
          <ul class="impacto">${(FOCO.impacto || []).map((x) => html`<li class=${x.endpoints.length ? "riesgo" : "ok"}>
            <span class="mono"><b>${x.simbolo}()</b></span> <span class="muted small mono">${base(x.archivo)}</span>
            <div class="small" style="margin-top:2px">${x.endpoints.length
              ? html`También pasan por acá: ${x.endpoints.map((id) => html`<span class="chip mono" style="margin:2px 4px 0 0">${id}</span>`)}`
              : html`<span class="muted">Ninguna otra ruta llega a esta función.</span>`}</div>
            ${x.usos?.length > 0 && html`<div class="small muted" style="margin-top:2px">Se llama desde: ${x.usos.map((u, j) => html`${j ? ", " : ""}<a class="mono" href=${href(hArch(u.archivo, u.linea))}>${base(u.archivo)}:${u.linea}</a>${u.funcion ? ` (${u.funcion})` : ""}`)}</div>`}</li>`)}</ul>
          <div class="etq">Tablas compartidas</div>
          ${compartidas.length ? html`<ul class="impacto">${compartidas.map((t) => html`<li class="riesgo"><span class="mono"><b>${t.tabla}</b></span>
            <div class="small" style="margin-top:2px">${t.endpoints.map((x) => html`<span class="chip mono" style="margin:2px 4px 0 0">${x.id}${x.ops.length ? " · " + x.ops.join("/") : ""}</span>`)}</div></li>`)}</ul>`
            : html`<p class="muted small" style="margin:0">Ninguna otra ruta usa estas tablas.</p>`}
          <div class="etq">Tests</div>
          ${e.tests == null ? html`<p class="muted small" style="margin:0">No se buscaron tests.</p>`
            : e.tests.length ? html`<ul class="impacto">${e.tests.map((t) => html`<li class="ok"><a class="mono small" href=${href(hArch(t.archivo, t.desde))}>${base(t.archivo)} · ${t.simbolo}</a></li>`)}</ul>`
            : html`<p class="aviso-test">No encontré tests que llamen a estas funciones ni a esta ruta. Antes del fix, conviene escribir uno que reproduzca el problema.</p>`}
          <button class="btn primario" style="margin-top:16px" onClick=${() => copiar(contextoFix(e))}><${Ic} n="copiar" s=${14} /> Copiar contexto para pedir el fix</button>
          <p class="muted small" style="margin:8px 0 0">Lleva el recorrido con archivos y líneas, las tablas, lo compartido y los problemas conocidos. Pegalo en tu terminal con Claude.</p>
        </div>
        ${HALL.length > 0 && html`<div class="etq" style="margin-top:20px">Problemas en este camino (${HALL.length})</div>${HALL.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} compacto />`)}`}
      </div>
    </div>
  </div>`;
}

// ───────────────────────── búsqueda y app ─────────────────────────
const INDICE = () => [
  ...EPS.map((e) => ({ t: `${e.metodo} ${e.ruta}`, s: e.resumen, tipo: "Endpoint", h: hEp(e.id), m: e.metodo })),
  ...TABLAS.map((t) => ({ t: t.nombre, s: t.resumen, tipo: "Tabla", h: hTabla(t.nombre) })),
  ...ARCHIVOS().map((p) => ({ t: p, s: ARCH[p]?.rol || "", tipo: "Archivo", h: hArch(p) })),
  ...HALL.map((h) => ({ t: h.titulo, s: h.categoria + " " + h.explicacion, tipo: "Hallazgo", h: hHall(h.id) })),
];

function Buscador() {
  const [q, setQ] = useState("");
  const [i, setI] = useState(0);
  const ref = useRef();
  useEffect(() => {
    const k = (e) => { if (e.key === "/" && !e.target.matches("input, textarea")) { e.preventDefault(); ref.current?.focus(); } };
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, []);
  const res = q.trim() ? INDICE().filter((x) => (x.t + " " + x.s).toLowerCase().includes(q.toLowerCase())).slice(0, 12) : [];
  const elegir = (x) => { ir(x.h); setQ(""); ref.current?.blur(); };
  return html`<div class="buscador">
    <${Ic} n="buscar" s=${15} />
    <input ref=${ref} placeholder="Buscar  ( / )" value=${q} aria-label="Buscar endpoints, tablas, archivos o hallazgos"
      onInput=${(e) => { setQ(e.target.value); setI(0); }}
      onKeyDown=${(e) => { if (e.key === "ArrowDown") { e.preventDefault(); setI(Math.min(i + 1, res.length - 1)); } if (e.key === "ArrowUp") { e.preventDefault(); setI(Math.max(i - 1, 0)); } if (e.key === "Enter" && res[i]) elegir(res[i]); if (e.key === "Escape") { setQ(""); e.target.blur(); } }} />
    ${res.length > 0 && html`<div class="resultados">${res.map((x, j) => html`<button class=${j === i ? "on" : ""} onMouseDown=${(e) => { e.preventDefault(); elegir(x); }}>
      ${x.m ? html`<${Metodo} m=${x.m} />` : null}<span class=${x.tipo === "Archivo" || x.tipo === "Tabla" ? "mono" : ""} style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.m ? x.t.slice(x.m.length + 1) : x.t}</span><span class="tipo">${x.tipo}</span></button>`)}</div>`}
  </div>`;
}

function cambiarTema() {
  const r = document.documentElement;
  const oscuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = oscuro ? "light" : "dark";
  try { localStorage.setItem("atlas-tema", r.dataset.theme); } catch {}
}
try { const t = localStorage.getItem("atlas-tema"); if (t) document.documentElement.dataset.theme = t; } catch {}

function App() {
  const [nav, setNav] = useState(leerHash());
  const [, setListo] = useState(false);
  const [toast, setToast] = useState("");
  useEffect(() => {
    const f = () => { setNav(leerHash()); };
    addEventListener("hashchange", f);
    cargarFuentes().then(() => setListo(true)).catch(() => setListo(true));
    avisar = (m) => { setToast(m); setTimeout(() => setToast(""), 2200); };
    return () => removeEventListener("hashchange", f);
  }, []);
  useEffect(() => { if (nav.vista !== "mapa") document.querySelector("main")?.scrollTo(0, 0); }, [nav.vista, nav.resto]);

  const { vista, resto, q } = nav;
  const altas = HALL.filter((h) => h.severidad === "alta").length;
  const TABS = FOCO
    ? [["foco", "Antes de tocarlo"], [hEp(FOCO.endpoint), "Recorrido"], ["db", "Tablas", TABLAS.length], ["archivos", "Archivos", ARCHIVOS().length], ["hallazgos", "Problemas", HALL.length]]
    : [["resumen", "Resumen"], ["mapa", "Mapa"], ["endpoints", "Endpoints", EPS.length], ["db", "Base de datos", TABLAS.length], ["archivos", "Archivos"], ["hallazgos", "Hallazgos", HALL.length]];
  const activa = vista === "endpoint" ? (FOCO ? hEp(FOCO.endpoint) : "endpoints") : FOCO && (vista === "resumen" || vista === "mapa") ? "foco" : vista;
  let cuerpo;
  if (FOCO && ["foco", "resumen", "mapa", "endpoints"].includes(vista)) cuerpo = html`<${VistaFoco} />`;
  else if (vista === "mapa") cuerpo = html`<${Mapa} q=${q} />`;
  else if (vista === "endpoints") cuerpo = html`<${Endpoints} q=${q} />`;
  else if (vista === "endpoint") { const i = resto.lastIndexOf("/"); cuerpo = html`<${EndpointDetalle} key=${resto} id=${i > 0 ? resto.slice(0, i) : resto} tab=${i > 0 ? resto.slice(i + 1) : "recorrido"} q=${q} />`; }
  else if (vista === "db") cuerpo = html`<${BaseDatos} nombre=${resto} />`;
  else if (vista === "archivos") cuerpo = html`<${Archivos} ruta=${resto} q=${q} />`;
  else if (vista === "hallazgos") cuerpo = html`<${Hallazgos} abierto=${resto} />`;
  else cuerpo = html`<${Resumen} />`;

  return html`
    <header class="top">
      <a class="marca" href=${href("resumen")} style="color:inherit;text-decoration:none"><${Ic} n="atlas" s=${20} />Atlas <small>${A.proyecto?.nombre}</small></a>
      <nav class="tabs" aria-label="Vistas">${TABS.map(([v, n, c]) => html`<a class=${activa === v ? "activa" : ""} href=${href(v)}>${n}${c != null && html`<span class=${"cuenta" + (v === "hallazgos" && altas ? " alerta" : "")}>${c}</span>`}</a>`)}</nav>
      <div class="der"><${Buscador} /><button class="icono-btn" onClick=${cambiarTema} title="Cambiar tema claro/oscuro" aria-label="Cambiar tema"><${Ic} n="sol" s=${16} /></button></div>
    </header>
    <main style=${vista === "mapa" ? "overflow:hidden" : ""}>${cuerpo}</main>
    ${toast && html`<div class="toast" role="status">${toast}</div>`}`;
}

document.title = "Atlas · " + (A.proyecto?.nombre || "código");
render(html`<${App} />`, document.getElementById("app"));
})();
</script>
</body>
