  :root {
    --bg:#f3f3f1; --panel:#ffffff; --panel-2:#ebebe7; --fg:#000000; --muted:#555b57;
    --line:#000000; --line-soft:#c9cbc6;
    --accent:#183e32; --accent-fill:#183e32; --accent-ink:#ffffff; --accent-soft:#dfe9e4;
    --code-bg:#fafaf8; --hl:#fff1a8; --hl-line:#9a7400; --sombra-c:#000000;
    --front:#24477a; --front-soft:#e3eaf4; --back:#183e32; --back-soft:#dfe9e4;
    --db:#7a4b1e; --db-soft:#f2e8dc; --infra:#555b57;
    --get:#24477a; --post:#183e32; --put:#8a5a00; --patch:#6b5a00; --delete:#9e2a2a;
    --alta:#9e2a2a; --media:#8a5a00; --baja:#555b57;
    --k:#5b2a86; --s:#183e32; --c:#555b57; --n:#8a5a00; --d:#24477a; --t:#24477a;
    --sombra-btn: 4px 4px 0 var(--sombra-c);
    --sombra-card: 6px 6px 0 var(--sombra-c);
    --sombra-hover: 2px 2px 0 var(--sombra-c);
    --font-display: "Archivo Black", "Arial Black", sans-serif;
    --font-body: "Archivo", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg:#101311; --panel:#171b18; --panel-2:#1f2420; --fg:#f3f3f1; --muted:#a7ada9;
    --line:#e8e8e4; --line-soft:#343a35;
    --accent:#8fd1b2; --accent-fill:#2f6b55; --accent-ink:#ffffff; --accent-soft:#1c2f27;
    --code-bg:#131714; --hl:#3a3410; --hl-line:#e6c34a; --sombra-c:#e8e8e4;
    --front:#9dbbe6; --front-soft:#1a2433; --back:#8fd1b2; --back-soft:#1c2f27;
    --db:#e0b07a; --db-soft:#2e2318; --infra:#a7ada9;
    --get:#9dbbe6; --post:#8fd1b2; --put:#e6b85c; --patch:#d9c560; --delete:#f08a8a;
    --alta:#f08a8a; --media:#e6b85c; --baja:#a7ada9;
    --k:#c9a6ef; --s:#8fd1b2; --c:#a7ada9; --n:#e6b85c; --d:#9dbbe6; --t:#9dbbe6;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  #app { height: 100%; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent); text-underline-offset: 2px; }
  .mono, code, pre { font-family: var(--font-mono); font-variant-ligatures: none; }
  h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1.15; }
  h1 { font-size: 32px; letter-spacing: -.03em; }
  h2 { font-size: 21px; }
  h3 { font-size: 15px; }
  h4 { margin: 0; font-family: var(--font-body); font-weight: 700; line-height: 1.3; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--hl); color: var(--fg); }

  /* ── cabecera ── */
  header.top { display: flex; align-items: center; gap: 20px; padding: 0 20px; min-height: 64px; background: var(--panel); border-bottom: 3px solid var(--line); flex-shrink: 0; }

  nav.tabs { display: flex; align-items: stretch; gap: 0; height: 64px; overflow-x: auto; scrollbar-width: none; }

  .der { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .buscador { position: relative; }
  .buscador input { width: 280px; padding: 8px 10px 8px 34px; border: 2px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; font-size: 14px; }

  @media (max-width: 1000px) { .buscador input { width: 200px; } .resultados { width: 320px; } }
  @media (max-width: 900px) { .marca small { display: none; } }

  main { flex: 1; min-height: 0; overflow: auto; }
  .pagina { max-width: 1280px; margin: 0 auto; padding: 26px 24px 48px; }

  .pagina-titulo p { margin: 6px 0 0; color: var(--muted); }

  /* ── piezas comunes ── */

  .card h3 { font-size: 14px; margin-bottom: 12px; }
  .grid { display: grid; gap: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel-2); color: var(--fg); white-space: nowrap; }

  .metodo.DELETE { color: var(--delete); background: color-mix(in srgb, var(--delete) 10%, var(--panel)); }

  .nac { color: var(--c-nac); }

  .btn { display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--fg); box-shadow: var(--sombra-btn); transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease; }

  .vacio { color: var(--muted); font-style: italic; }
  .subtabs { display: flex; gap: 0; border-bottom: 2px solid var(--line); margin: 20px 0 16px; overflow-x: auto; }
  .subtabs a { padding: 9px 14px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; font-weight: 600; }
  .subtabs a:hover { color: var(--fg); background: var(--panel-2); }
  .subtabs a.activa { color: var(--fg); border-bottom-color: var(--accent); }
  .tabla { width: 100%; border-collapse: collapse; font-size: 13px; }

  /* ── código ── */

  .codigo-cab .ruta { font-family: var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .codigo-cab .der { gap: 4px; }
  .codigo-cab button { border: 1px solid var(--line-soft); background: var(--panel); color: var(--muted); font-size: 12px; padding: 2px 7px; border-radius: 6px; }
  .codigo-cab button:hover { color: var(--fg); background: var(--panel-2); border-color: var(--line); }
  .codigo pre { margin: 0; padding: 8px 0; overflow: auto; font-size: 12.5px; line-height: 1.6; }
  .codigo pre.alto { max-height: 520px; }
  .ln { display: block; padding-right: 14px; white-space: pre; border-left: 3px solid transparent; }
  .ln i { display: inline-block; width: 46px; padding-right: 14px; text-align: right; color: var(--muted); font-style: normal; user-select: none; opacity: .75; }
  .ln.sel { background: var(--hl); border-left-color: var(--hl-line); }
  .ln.err { background: color-mix(in srgb, var(--alta) 12%, transparent); border-left-color: var(--alta); }
  .ln.err.media { background: color-mix(in srgb, var(--media) 12%, transparent); border-left-color: var(--media); }
  .ln.err.baja { background: color-mix(in srgb, var(--baja) 12%, transparent); border-left-color: var(--baja); }
  .ln .sk { color: var(--k); } .ln .ss { color: var(--s); } .ln .sc { color: var(--c); font-style: italic; } .ln .sn { color: var(--n); } .ln .sd { color: var(--d); } .ln .st { color: var(--t); }
  .salto { display: block; padding: 2px 0 2px 63px; color: var(--muted); font-size: 11.5px; }

  /* ── resumen ── */
  .hero { display: flex; gap: 20px; align-items: flex-start; padding: 24px; border-radius: 16px; box-shadow: var(--sombra-card); }
  .hero .logo { width: 52px; height: 52px; border: 2px solid var(--line); border-radius: 8px; background: var(--accent-fill); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1; }
  .hero h1 { font-size: 34px; }
  .hero p { margin: 8px 0 14px; color: var(--muted); max-width: 72ch; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .stat { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; padding: 16px; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .stat:hover { border-color: var(--accent); box-shadow: 4px 4px 0 var(--sombra-c); transform: translate(-2px, -2px); }
  .stat .ic { width: 38px; height: 38px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; background: var(--panel-2); color: var(--fg); flex-shrink: 0; }
  .stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 27px; line-height: 1; letter-spacing: -.03em; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .dos { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .mini-mapa { display: flex; align-items: stretch; gap: 0; }
  .mini-mapa a { flex: 1; text-decoration: none; color: inherit; border: 2px solid var(--c-nac); background: var(--c-soft); border-radius: 8px; padding: 14px; text-align: left; transition: transform .12s ease, box-shadow .12s ease; }
  .mini-mapa a:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--sombra-c); }
  .mini-mapa a b { display: block; font-family: var(--font-display); font-weight: 400; color: var(--c-nac); margin: 8px 0 2px; }
  .mini-mapa a small { color: var(--muted); }
  .mini-mapa .flecha { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 8px; color: var(--muted); font: 600 10.5px/1.2 var(--font-mono); min-width: 66px; text-align: center; }
  .pasos-sugeridos { list-style: none; padding: 0; margin: 0; counter-reset: s; }
  .pasos-sugeridos > li { counter-increment: s; display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .pasos-sugeridos > li:last-child { border-bottom: 0; }
  .pasos-sugeridos > li::before { content: counter(s); width: 24px; height: 24px; border: 2px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--fg); font-family: var(--font-display); font-weight: 400; font-size: 12px; display: grid; place-items: center; flex-shrink: 0; }

  /* ── mapa ── */
  .mapa { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
  .lienzo { overflow: auto; position: relative; }
  .plano { position: relative; display: grid; grid-template-columns: minmax(140px, 1fr) minmax(140px, 1fr) minmax(250px, 1.5fr) minmax(150px, 1fr); gap: 0 36px; padding: 18px 16px 40px; min-width: 860px; align-items: start; }
  .plano svg.cables { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
  .nacion { border: 2px solid var(--line); background: var(--c-soft); border-radius: 8px; padding: 14px 14px 18px; position: relative; }
  .nacion.doble { grid-column: span 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 36px; align-content: start; }
  .nacion.doble > .nacion-cab { grid-column: 1 / -1; }
  .nacion-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); }
  .nacion-cab .ic { width: 34px; height: 34px; border: 2px solid var(--c-nac); border-radius: 6px; background: var(--c-nac); color: var(--panel); display: grid; place-items: center; flex-shrink: 0; }
  .nacion-cab h2 { font-size: 15px; color: var(--c-nac); }
  .nacion-cab small { color: var(--muted); font-size: 12px; }
  .grupo-t { font-size: 11px; letter-spacing: 0; color: var(--muted); font-weight: 700; margin: 4px 2px 8px; }
  .grupo-t:not(:first-of-type) { margin-top: 16px; }
  .nodo { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; transition: opacity .15s, border-color .15s, box-shadow .15s, transform .15s; position: relative; }
  .nodo:hover { border-color: var(--c-nac); box-shadow: 2px 2px 0 var(--sombra-c); transform: translate(-1px, -1px); }
  .nodo.foco { border: 2px solid var(--c-nac); padding: 7px 9px; box-shadow: 4px 4px 0 var(--sombra-c); }
  .nodo.tenue { opacity: .3; }
  .nodo .nom { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nodo .sub { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nodo .txt { min-width: 0; flex: 1; }
  .nodo .ruta-ep { font-family: var(--font-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .nodo .metodo { min-width: 50px; font-size: 10px; padding: 4px 5px; }
  .nodo .marcas { display: flex; gap: 5px; align-items: center; color: var(--muted); }
  .nodo.fantasma { border-style: dashed; border-color: var(--alta); background: color-mix(in srgb, var(--alta) 6%, var(--panel)); }
  .nodo.fantasma .ruta-ep { text-decoration: line-through; color: var(--alta); }
  .sin-uso { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px dashed var(--muted); padding: 0 5px; border-radius: 6px; }
  .internos { display: flex; flex-wrap: wrap; gap: 6px; }
  .interno { font-size: 11.5px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 8px; font-family: var(--font-mono); transition: opacity .15s; }
  .interno.foco { border-color: var(--back); color: var(--back); font-weight: 700; }
  .interno.tenue { opacity: .3; }
  .cable { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .3; transition: opacity .15s; }
  .cable.activo { stroke: var(--accent); opacity: 1; stroke-width: 2.4; }
  .cable.roto { stroke: var(--alta); stroke-dasharray: 5 4; opacity: .55; }
  .cable.roto.activo { opacity: 1; }
  .cable-et { font-size: 10.5px; font-weight: 700; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; font-family: var(--font-mono); }
  .leyenda-mapa { position: sticky; left: 0; display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 20px 0; font-size: 12px; color: var(--muted); align-items: center; }
  .leyenda-mapa span { display: inline-flex; align-items: center; gap: 6px; }
  aside.lateral { border-left: 2px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 22px 32px; }
  aside.lateral h2 { font-size: 18px; word-break: break-word; }
  .participa { display: grid; gap: 10px; margin-top: 4px; }
  .participa .bloque { border-left: 3px solid var(--c-nac); padding: 2px 0 2px 12px; }
  .participa .bloque h4 { font-size: 12px; color: var(--c-nac); margin-bottom: 4px; }
  .participa ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .participa li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .participa li .l { margin-left: auto; color: var(--muted); font-size: 11.5px; font-family: var(--font-mono); }
  .op { font: 700 10px/1 var(--font-mono); padding: 3px 5px; border-radius: 6px; border: 1px solid var(--db); background: var(--db-soft); color: var(--db); }
  @media (max-width: 1100px) { .mapa { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 62vh) auto; } aside.lateral { border-left: 0; border-top: 2px solid var(--line); } }

  /* ── endpoints ── */
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filtros input, .filtros select { padding: 8px 10px; border: 2px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; font-size: 14px; }
  .filtros input { flex: 1 1 220px; }
  .seg { display: inline-flex; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
  .seg button:hover { background: var(--panel-2); color: var(--fg); }
  .seg button.on { background: var(--accent-fill); color: var(--accent-ink); font-weight: 700; }
  .lado { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }

  .lado nav button { display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--line-soft); background: var(--panel); padding: 8px 12px; border-radius: 6px; text-align: left; color: var(--muted); font-weight: 500; }
  .lado nav button:hover { background: var(--panel-2); color: var(--fg); border-color: var(--line); }
  .lado nav button.on { background: var(--accent-fill); border-color: var(--line); color: var(--accent-ink); font-weight: 700; }
  .lado nav button.on:hover { background: var(--accent-fill); color: var(--accent-ink); }
  @media (max-width: 800px) { .lado { grid-template-columns: 1fr; } .lado nav { flex-direction: row; overflow-x: auto; position: static; padding-bottom: 4px; } .lado nav button { white-space: nowrap; } }
  .ruta-cel { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }

  /* ── recorrido ── */
  .ep-cab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .volver { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); text-decoration: none; font-size: 13px; margin-bottom: 10px; }
  .volver:hover { color: var(--fg); text-decoration: underline; }
  .stepper { display: flex; flex-wrap: nowrap; row-gap: 0; gap: 0; padding: 7px 6px 10px; align-items: stretch; overflow-x: auto; scrollbar-width: thin; }
  .paso { flex: 1 1 150px; min-width: 0; max-width: 220px; border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; text-align: left; position: relative; transition: border-color .12s ease, background-color .12s ease; }
  .paso:hover { border-color: var(--c-nac); background: var(--panel-2); }

  .paso .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--c-nac); border-radius: 6px; background: var(--c-soft); color: var(--c-nac); font-family: var(--font-display); font-weight: 400; font-size: 12px; margin-right: 6px; }

<script>
(() => {
"use strict";
const { html, render, useState, useEffect, useMemo, useRef, useLayoutEffect } = window.htmPreact;

let A;
try { A = JSON.parse(document.getElementById("atlas-datos").textContent); }
catch {
  render(html`<div class="card aviso"><h2>Plantilla sin datos</h2><p>Este archivo es la plantilla del visor. Generalo con <code>python3 scripts/build.py &lt;repo&gt;</code>.</p></div>`, document.getElementById("app"));
  return;
}

// ───────────────────────── índices ─────────────────────────
const SEV = { alta: 0, media: 1, baja: 2 };
const SEV_TXT = { alta: "Alta", media: "Media", baja: "Baja" };
const uniq = (xs) => [...new Set(xs)];
const base = (p) => p.split("/").pop();
const epId = (e) => `${e.metodo} ${e.ruta}`;
const ARCH = A.archivos || {};
const NACIONES = A.naciones || [];
const NAC = Object.fromEntries(NACIONES.map((n) => [n.id, n]));
const nacionDe = (p) => ARCH[p]?.nacion || NACIONES.find((n) => n.dir && p.startsWith(n.dir + "/"))?.id || "infra";
const capaDe = (p) => ARCH[p]?.capa || "";
const CAPA_TXT = { pagina: "Pantalla", "cliente-api": "Cliente API", router: "Router", service: "Service", repository: "Repository",
  modelo: "Modelo", schema: "Schema", seguridad: "Seguridad", config: "Config", aplicacion: "Aplicación", rutas: "Rutas", db: "Base de datos" };

const HALL = [...(A.hallazgos || [])].sort((a, b) => SEV[a.severidad] - SEV[b.severidad]);
const HID = new Map(HALL.map((h) => [h.id, h]));
const TABLAS = A.tablas || [];
const TB = new Map(TABLAS.map((t) => [t.nombre, t]));
const ROTAS = (A.llamadas_rotas || []).map((r, i) => ({ ...r, id: "r" + i, usadoEn: r.usadoEn || [] }));
// modo foco: el atlas se generó para un solo endpoint (build.py --endpoint)
const FOCO = A.foco || null;

const EPS = (A.endpoints || []).map((e) => {
  const id = epId(e);
  const frontend = e.frontend || [];
  const pasos = e.pasos || [];
  return {
    ...e, id, frontend, pasos,
    hall: HALL.filter((h) => h.endpoint === id),
    pantallas: uniq(frontend.filter((r) => capaDe(r.archivo) === "pagina").map((r) => r.archivo)),
    clientes: uniq(frontend.filter((r) => capaDe(r.archivo) === "cliente-api").map((r) => r.archivo)),
    backend: uniq(pasos.filter((p) => p.archivo && nacionDe(p.archivo) === "backend").map((p) => p.archivo)),
    tbs: uniq((e.tablas || []).map((t) => t.tabla)),
  };
});
const EP = new Map(EPS.map((e) => [e.id, e]));
const opsDe = (e, t) => uniq((e.tablas || []).filter((x) => x.tabla === t).map((x) => x.op));
const usosTabla = (t) => EPS.filter((e) => e.tbs.includes(t));
const hallDeArchivo = (p) => HALL.filter((h) => h.archivo === p);
const epsDeArchivo = (p) => EPS.filter((e) => e.frontend.some((r) => r.archivo === p) || e.pasos.some((s) => s.archivo === p) || e.entrada?.archivo === p);
const hallDeTabla = (t) => HALL.filter((h) => h.tabla === t);
const peorSev = (hs) => (hs.length ? hs.reduce((m, h) => (SEV[h.severidad] < SEV[m] ? h.severidad : m), "baja") : null);
const hallDeRango = (archivo, desde, hasta) => HALL.filter((h) => h.archivo === archivo && h.desde <= hasta && h.hasta >= desde);

// fuentes comprimidas con gzip dentro del HTML
let FUENTES = {};
async function cargarFuentes() {
  if (!A.fuentesGz) return;
  const bin = Uint8Array.from(atob(A.fuentesGz), (c) => c.charCodeAt(0));
  const flujo = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  FUENTES = JSON.parse(await new Response(flujo).text());
}

// ───────────────────────── resaltado de código ─────────────────────────
const KW = {
  py: "def class return if elif else for while in not and or is import from as with try except finally raise pass yield async await lambda None True False self",
  ts: "import from export default const let var function return if else for while of in new await async try catch finally throw class extends type interface as typeof null undefined true false",
  java: "public private protected class interface enum return if else for while new try catch finally throw throws static final void extends implements import package this null true false",
};
const LANG = (p) => (/\.py$/.test(p) ? "py" : /\.(t|j)sx?$|\.mjs$/.test(p) ? "ts" : /\.java$/.test(p) ? "java" : "");
const RE_CACHE = {};
function reLang(l) {
  if (RE_CACHE[l]) return RE_CACHE[l];
  const com = l === "py" || l === "" ? "#.*$" : "\\/\\/.*$";
  const kw = KW[l] ? `\\b(?:${KW[l].split(" ").join("|")})\\b` : "(?!)";
  return (RE_CACHE[l] = new RegExp(`(${com})|("(?:\\\\.|[^"\\\\])*"|'(?:\\\\.|[^'\\\\])*'|\`(?:\\\\.|[^\`\\\\])*\`)|(@\\w+)|(${kw})|\\b(\\d+(?:\\.\\d+)?)\\b|(<\\/?[A-Z][\\w.]*)`, "g"));
}
function colorear(linea, l) {
  const out = [];
  let i = 0;
  const re = reLang(l);
  re.lastIndex = 0;
  for (let m; (m = re.exec(linea)); ) {
    if (m.index > i) out.push(linea.slice(i, m.index));
    const cls = m[1] ? "sc" : m[2] ? "ss" : m[3] ? "sd" : m[4] ? "sk" : m[5] ? "sn" : "st";
    out.push(html`<span class=${cls}>${m[0]}</span>`);
    i = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  if (i < linea.length) out.push(linea.slice(i));
  return out;
}

function Codigo({ archivo, desde, hasta, contexto = 3, completo: completoIni = false, titulo, sev }) {
  const [completo, setCompleto] = useState(completoIni);
  const ref = useRef();
  const txt = FUENTES[archivo];
  useLayoutEffect(() => {
    if (completo && ref.current && desde) {
      const el = ref.current.querySelector(`[data-l="${desde}"]`);
      if (el) ref.current.scrollTop = el.offsetTop - 40;
    }
  }, [completo, archivo, desde]);
  if (txt == null) return html`<div class="codigo"><div class="codigo-cab"><span class="ruta">${archivo}</span></div><p class="vacio" style="padding:10px 14px;margin:0">Código no incluido en el atlas.</p></div>`;
  const lineas = txt.split("\n");
  const l = LANG(archivo);
  const d = desde || 1, h = hasta || desde || lineas.length;
  const ini = completo || !desde ? 1 : Math.max(1, d - contexto);
  const fin = completo || !desde ? lineas.length : Math.min(lineas.length, h + contexto);
  const errores = HALL.filter((x) => x.archivo === archivo && x.desde);
  const claseLinea = (n) => {
    if (desde && n >= d && n <= h) return sev ? "ln err " + sev : "ln sel";
    const e = (completo || !desde) && errores.find((x) => n >= x.desde && n <= x.hasta);
    return e ? "ln err " + e.severidad : "ln";
  };
  const filas = [];
  if (ini > 1) filas.push(html`<span class="salto">⋯ ${ini - 1} líneas arriba</span>`);
  for (let n = ini; n <= fin; n++) filas.push(html`<span class=${claseLinea(n)} data-l=${n}><i>${n}</i>${colorear(lineas[n - 1], l)}${"\n"}</span>`);
  if (fin < lineas.length) filas.push(html`<span class="salto">⋯ ${lineas.length - fin} líneas abajo</span>`);
  return html`<div class="codigo">
    <div class="codigo-cab">
      <${Ic} n="file" s=${13} />
      <a class="ruta" href=${href(hArch(archivo, desde))} title="Abrir en Archivos">${titulo || archivo}${desde ? `:${d}${h !== d ? "–" + h : ""}` : ""}</a>
      <span class="der">

        <button onClick=${() => copiar(lineas.slice(d - 1, h).join("\n"))} title="Copiar fragmento"><${Ic} n="copiar" s=${13} /></button>
      </span>
    </div>
    <pre ref=${ref} class=${completo ? "alto" : ""}>${filas}</pre>
  </div>`;
}

// ───────────────────────── Mapa ─────────────────────────
function relacionados(foco) {
  if (!foco) return null;
  const s = new Set([foco]);
  const conEp = (e) => { s.add("e:" + e.id); e.pantallas.forEach((p) => s.add("p:" + p)); e.clientes.forEach((c) => s.add("c:" + c)); e.tbs.forEach((t) => s.add("t:" + t)); e.backend.forEach((b) => s.add("b:" + b)); };
  const conRota = (r) => { s.add("r:" + r.id); s.add("c:" + r.archivo); r.usadoEn.forEach((u) => s.add("p:" + u.archivo)); };
  const [tipo, ...resto] = foco.split(":");
  const id = resto.join(":");
  if (tipo === "e") conEp(EP.get(id));
  if (tipo === "p") { EPS.filter((e) => e.pantallas.includes(id)).forEach((e) => { conEp(e); }); ROTAS.filter((r) => r.usadoEn.some((u) => u.archivo === id)).forEach(conRota);
    // de una pantalla solo interesa esa pantalla, no las otras que llaman a los mismos endpoints
    for (const x of [...s]) if (x.startsWith("p:") && x !== foco) s.delete(x); }
  if (tipo === "c") { EPS.filter((e) => e.clientes.includes(id)).forEach(conEp); ROTAS.filter((r) => r.archivo === id).forEach(conRota); }
  if (tipo === "t") EPS.filter((e) => e.tbs.includes(id)).forEach(conEp);
  if (tipo === "r") conRota(ROTAS.find((r) => r.id === id));
  if (tipo === "b") EPS.filter((e) => e.backend.includes(id)).forEach(conEp);
  return s;
}

const CABLES = (() => {
  const out = [], visto = new Set();
  const add = (de, a, et, roto) => { const k = de + ">" + a; if (!visto.has(k)) { visto.add(k); out.push({ de, a, et, roto }); } };
  for (const e of EPS) {
    for (const c of e.clientes) add("c:" + c, "e:" + e.id);
    for (const p of e.pantallas) for (const c of e.clientes) add("p:" + p, "c:" + c);
    for (const t of e.tbs) add("e:" + e.id, "t:" + t, opsDe(e, t).join(" · "));
  }
  for (const r of ROTAS) { add("c:" + r.archivo, "r:" + r.id, "", true); for (const u of r.usadoEn) add("p:" + u.archivo, "c:" + r.archivo); }
  return out;
})();

function Mapa({ q }) {
  const sel = q.get("sel");
  const [hover, setHover] = useState(null);
  const foco = hover || sel;
  const rel = useMemo(() => relacionados(foco), [foco]);
  const plano = useRef();
  const lateral = useRef();
  useEffect(() => { if (lateral.current) lateral.current.scrollTop = 0; }, [foco]);
  const [geo, setGeo] = useState({ pos: {}, w: 0, h: 0 });

  const medir = () => {
    const el = plano.current;
    if (!el) return;
    const R = el.getBoundingClientRect(), pos = {};
    el.querySelectorAll("[data-n]").forEach((n) => {
      const r = n.getBoundingClientRect();
      pos[n.dataset.n] = { x1: r.left - R.left, x2: r.right - R.left, y: r.top - R.top + r.height / 2 };
    });
    setGeo({ pos, w: el.scrollWidth, h: el.scrollHeight });
  };
  useLayoutEffect(() => {
    medir();
    const ro = new ResizeObserver(medir);
    ro.observe(plano.current);
    return () => ro.disconnect();
  }, []);
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape" && sel) ir("mapa"); };
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, [sel]);

  const elegir = (id) => ir(sel === id ? "mapa" : "mapa?sel=" + encodeURIComponent(id));
  const estado = (id) => (foco === id ? " foco" : rel && !rel.has(id) ? " tenue" : "");
  const props = (id, extra = "") => ({ "data-n": id, class: "nodo" + extra + estado(id), onClick: () => elegir(id), onMouseEnter: () => setHover(id), onMouseLeave: () => setHover(null), onFocus: () => setHover(id), onBlur: () => setHover(null) });

  const pantallas = Object.keys(ARCH).filter((p) => capaDe(p) === "pagina");
  const clientes = Object.keys(ARCH).filter((p) => capaDe(p) === "cliente-api");
  const internos = Object.keys(ARCH).filter((p) => ["service", "repository", "seguridad"].includes(capaDe(p)));
  const etiquetas = uniq(EPS.map((e) => e.etiqueta || "Otros"));

  const cables = CABLES.map((c) => {
    const p = geo.pos[c.de], q2 = geo.pos[c.a];
    if (!p || !q2) return null;
    const activo = rel && rel.has(c.de) && rel.has(c.a);
    const x1 = p.x2, x2 = q2.x1 - 3, dx = Math.max(24, (x2 - x1) / 2);
    const d = `M${x1},${p.y} C${x1 + dx},${p.y} ${x2 - dx},${q2.y} ${x2},${q2.y}`;
    return html`<g key=${c.de + c.a}>
      <path class=${"cable" + (c.roto ? " roto" : "") + (activo ? " activo" : "")} d=${d} marker-end=${activo ? "url(#pa)" : ""} />
      ${activo && c.et && html`<text class="cable-et" x=${x1 + 6} y=${p.y - 6}>${c.et}</text>`}
    </g>`;
  });

  return html`<div class="mapa">
    <div class="lienzo">
      <div class="leyenda-mapa">
        <span>Pasá el mouse o tocá cualquier pieza para ver con qué se conecta.</span>
        <span><span class="punto alta"></span>tiene hallazgos</span>
        <span><span class="sin-uso">sin uso</span>nadie lo llama</span>
        <span><svg width="26" height="8"><path d="M0,4 H26" stroke="var(--alta)" stroke-dasharray="5 4" stroke-width="1.5" /></svg>llamada rota</span>
      </div>

          ${cables}

        <section class="nacion doble nac-frontend">
          <div class="nacion-cab"><div class="ic"><${Ic} n="frontend" s=${18} /></div><div><h2>${NAC.frontend?.nombre || "Frontend"}</h2><small>${NAC.frontend?.tipo}</small></div></div>
          <div>
            <div class="grupo-t">Pantallas</div>
            ${pantallas.map((p) => { const hs = hallDeArchivo(p); return html`<button ...${props("p:" + p)}>
              <div class="txt"><div class="nom">${base(p).replace(/\.\w+$/, "")}</div><div class="sub">${ARCH[p]?.rol}</div></div>
              ${hs.length > 0 && html`<span class=${"punto " + peorSev(hs)}></span>`}
            </button>`; })}
          </div>
          <div>
            <div class="grupo-t">Cliente API</div>
            ${clientes.map((c) => { const hs = hallDeArchivo(c); return html`<button ...${props("c:" + c)}>
              <div class="txt"><div class="nom mono">${base(c)}</div><div class="sub">${ARCH[c]?.rol}</div></div>
              ${hs.length > 0 && html`<span class=${"punto " + peorSev(hs)}></span>`}
            </button>`; })}
          </div>
        </section>

        <section class="nacion nac-backend">
          <div class="nacion-cab"><div class="ic"><${Ic} n="backend" s=${18} /></div><div><h2>${NAC.backend?.nombre || "Backend"}</h2><small>${NAC.backend?.tipo}</small></div></div>
          ${etiquetas.map((et) => html`
            <div class="grupo-t">${et}</div>
            ${EPS.filter((e) => (e.etiqueta || "Otros") === et).map((e) => html`<button ...${props("e:" + e.id)} title=${e.resumen}>
              <${Metodo} m=${e.metodo} />
              <span class="ruta-ep">${e.ruta}</span>
              <span class="marcas">

                ${e.auth ? html`<${Ic} n="lock" s=${12} />` : null}
                ${e.hall.length > 0 && html`<span class=${"punto " + peorSev(e.hall)}></span>`}
              </span>
            </button>`)}`)}
          ${ROTAS.length > 0 && html`<div class="grupo-t" style="color:var(--alta)">Llamadas a rutas que no existen</div>
            ${ROTAS.map((r) => html`<button ...${props("r:" + r.id, " fantasma")} title="El frontend llama a esta ruta, pero el backend no la tiene">
              <${Metodo} m=${r.metodo} /><span class="ruta-ep">${r.ruta}</span><span class="punto alta"></span>
            </button>`)}`}
          ${internos.length > 0 && html`<div class="grupo-t">Por dentro</div>
            <div class="internos">${internos.map((b) => html`<span data-b=${b} class=${"interno" + (rel ? (rel.has("b:" + b) ? " foco" : " tenue") : "")} title=${ARCH[b]?.rol}>${base(b)}</span>`)}</div>`}
        </section>

        <section class="nacion nac-db">
          <div class="nacion-cab"><div class="ic"><${Ic} n="db" s=${18} /></div><div><h2>${NAC.db?.nombre || "Base de datos"}</h2><small>${NAC.db?.tipo}</small></div></div>
          <div class="grupo-t">Tablas</div>
          ${TABLAS.map((t) => { const hs = hallDeTabla(t.nombre); const usos = usosTabla(t.nombre).length; return html`<button ...${props("t:" + t.nombre)}>
            <div class="txt"><div class="nom mono">${t.nombre}</div><div class="sub">${t.campos.length} campos · ${usos} endpoint${usos === 1 ? "" : "s"}</div></div>
            ${hs.length > 0 && html`<span class=${"punto " + peorSev(hs)}></span>`}
          </button>`; })}

function Bienvenida() {
  return html`<div>
    <h2>Cómo leer el mapa</h2>
    <p class="muted">Cada columna de color es una "nación" del sistema. Las flechas muestran quién habla con quién.</p>
    ${["frontend", "backend", "db"].filter((n) => NAC[n]).map((n) => html`<div class=${"participa nac-" + n} style="margin-top:14px">
      <div class="bloque"><h4>${NAC[n].nombre} · ${NAC[n].tipo}</h4><p style="margin:0;font-size:13px">${NAC[n].resumen}</p></div>
    </div>`)}
    <div class="pregunta"><b>Probá esto</b>Tocá <span class="mono">POST</span> en Appointments: vas a ver la pantalla que lo dispara, la función que hace el pedido y las tablas que escribe.</div>
  </div>`;
}

function Detalle({ id, fijo }) {
  const [tipo, ...resto] = id.split(":");
  const x = resto.join(":");
  if (tipo === "e") return html`<${DetalleEndpoint} e=${EP.get(x)} />`;
  if (tipo === "t") return html`<${DetalleTabla} t=${TB.get(x)} />`;
  if (tipo === "r") return html`<${DetalleRota} r=${ROTAS.find((r) => r.id === x)} />`;
  return html`<${DetalleArchivo} p=${x} />`;
}

function Participa({ e }) {
  return html`<div class="participa">
    <div class="bloque nac-frontend"><h4>Frontend: quién lo llama</h4>
      ${e.frontend.length ? html`<ul>${e.frontend.map((r) => html`<li><a href=${href(hArch(r.archivo, r.desde))}>${base(r.archivo)}</a><span class="muted">${r.simbolo ? r.simbolo + "()" : ""}</span><span class="l">:${r.desde}</span></li>`)}</ul>`
        : html`<p class="vacio" style="margin:0;font-size:13px">Ninguna pantalla lo usa.</p>`}
    </div>
    <div class="bloque nac-backend"><h4>Backend: por dónde pasa</h4>
      <ul>${e.pasos.filter((p) => p.archivo && nacionDe(p.archivo) === "backend").map((p) => html`<li><a href=${href(hArch(p.archivo, p.desde))}>${base(p.archivo)}</a><span class="muted">${p.simbolo ? p.simbolo + "()" : ""}</span><span class="l">:${p.desde}</span></li>`)}</ul>
    </div>
    <div class="bloque nac-db"><h4>Base de datos: qué toca</h4>
      ${e.tbs.length ? html`<ul>${e.tbs.map((t) => html`<li><a href=${href(hTabla(t))} class="mono">${t}</a>${opsDe(e, t).map((o) => html`<span class="op">${o}</span>`)}</li>`)}</ul>` : html`<p class="vacio" style="margin:0">No toca la base.</p>`}
    </div>
  </div>`;
}

function DetalleEndpoint({ e }) {
  const handler = e.pasos.find((p) => p.archivo && capaDe(p.archivo) === "router");
  return html`<div>
    <div class="chips" style="margin-bottom:8px"><${Metodo} m=${e.metodo} /><${Auth} e=${e} /></div>
    <h2 class="mono">${e.ruta}</h2>
    <p>${e.explicacion || e.resumen}</p>
    <div class="chips"><a class="btn primario" href=${href(hEp(e.id))}>Ver recorrido paso a paso <${Ic} n="flecha" s=${14} /></a></div>
    <div class="etq" style="margin-top:20px">Dónde participa</div>
    <${Participa} e=${e} />
    ${e.hall.length > 0 && html`<div class="etq">Hallazgos (${e.hall.length})</div>${e.hall.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} compacto />`)}`}
    ${handler && html`<div class="etq">Código del endpoint</div><${Codigo} archivo=${handler.archivo} desde=${handler.desde} hasta=${handler.hasta} contexto=${0} />`}
  </div>`;
}

function DetalleTabla({ t }) {
  const usos = usosTabla(t.nombre);
  return html`<div>
    <div class="chips" style="margin-bottom:8px"><${ChipNac} n="db" /><span class="chip mono">${t.modelo}</span></div>
    <h2 class="mono">${t.nombre}</h2>
    <p>${t.resumen}</p>
    <div class="chips"><a class="btn primario" href=${href(hTabla(t.nombre))}>Ver campos y relaciones <${Ic} n="flecha" s=${14} /></a></div>
    <div class="etq" style="margin-top:20px">La usan (${usos.length})</div>
    <div class="participa"><div class="bloque nac-backend"><ul>${usos.map((e) => html`<li><${Metodo} m=${e.metodo} /><a href=${href(hEp(e.id))} class="mono" style="font-size:12px">${e.ruta}</a><span class="l">${opsDe(e, t.nombre).join(" · ")}</span></li>`)}</ul></div></div>
    <div class="etq">Campos</div>
    <table class="tabla"><tbody>${t.campos.map((c) => html`<tr><td class="mono">${c.nombre}${c.sensible ? html` <span style="color:var(--alta)" title="Dato sensible">●</span>` : ""}</td><td class="muted mono">${c.tipo}</td><td>${c.clave ? html`<span class="chip">${c.clave.toUpperCase()}${c.ref ? " → " + c.ref : ""}</span>` : ""}</td></tr>`)}</tbody></table>
  </div>`;
}

function DetalleRota({ r }) {
  const h = HID.get(r.hallazgo);
  return html`<div>
    <div class="chips" style="margin-bottom:8px"><${Metodo} m=${r.metodo} /><span class="sev alta">Ruta inexistente</span></div>
    <h2 class="mono" style="text-decoration:line-through;color:var(--alta)">${r.ruta}</h2>
    <p>El frontend llama a esta ruta, pero el backend no la tiene.${r.coincide_con ? html` En cambio, coincide con <a href=${href(hEp(r.coincide_con))} class="mono">${r.coincide_con}</a>.` : ""}</p>
    ${h && html`<${TarjetaHallazgo} h=${h} abierto />`}
  </div>`;
}

function DetalleArchivo({ p }) {
  const eps = epsDeArchivo(p);
  const hs = hallDeArchivo(p);
  const n = nacionDe(p);
  return html`<div>
    <div class="chips" style="margin-bottom:8px"><${ChipNac} n=${n} />${capaDe(p) && html`<span class="chip">${CAPA_TXT[capaDe(p)] || capaDe(p)}</span>`}</div>
    <h2 class="mono">${base(p)}</h2>
    <p class="muted mono" style="font-size:12px;margin:2px 0 8px">${p}</p>
    <p>${ARCH[p]?.rol}</p>
    <div class="chips"><a class="btn" href=${href(hArch(p))}>Ver archivo completo</a></div>
    ${eps.length > 0 && html`<div class="etq" style="margin-top:20px">Endpoints que usa (${eps.length})</div>
      <div class="participa"><div class="bloque nac-backend"><ul>${eps.map((e) => html`<li><${Metodo} m=${e.metodo} /><a href=${href(hEp(e.id))} class="mono" style="font-size:12px">${e.ruta}</a></li>`)}</ul></div></div>`}
    ${ROTAS.filter((r) => r.archivo === p || r.usadoEn.some((u) => u.archivo === p)).map((r) => html`<div class="etq">Llamada rota</div><${DetalleRota} r=${r} />`)}
    ${hs.length > 0 && html`<div class="etq">Hallazgos (${hs.length})</div>${hs.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} compacto />`)}`}
  </div>`;
}

// ───────────────────────── Endpoints ─────────────────────────
function Endpoints({ q }) {
  const [texto, setTexto] = useState("");
  const [metodo, setMetodo] = useState("");
  const [soloHall, setSoloHall] = useState(false);
  const etq = q.get("etiqueta") || "";
  const etiquetas = uniq(EPS.map((e) => e.etiqueta || "Otros"));
  const lista = EPS.filter((e) => (!etq || (e.etiqueta || "Otros") === etq) && (!metodo || e.metodo === metodo) && (!soloHall || e.hall.length)
    && (!texto || (e.ruta + " " + e.resumen).toLowerCase().includes(texto.toLowerCase())));
  return html`<div class="pagina">
    <div class="pagina-titulo"><div><h1>Endpoints</h1><p>Todo lo que expone el backend. Tocá uno para ver su recorrido completo.</p></div></div>
    <div class="filtros">
      <input placeholder="Buscar ruta o descripción…" value=${texto} onInput=${(e) => setTexto(e.target.value)} />
      <div class="seg">${["", "GET", "POST", "PUT", "PATCH", "DELETE"].filter((m) => !m || EPS.some((e) => e.metodo === m)).map((m) => html`<button class=${metodo === m ? "on" : ""} onClick=${() => setMetodo(m)}>${m || "Todos"}</button>`)}</div>
      <label class="chip" style="cursor:pointer"><input type="checkbox" checked=${soloHall} onChange=${(e) => setSoloHall(e.target.checked)} /> Solo con hallazgos</label>
    </div>
    <div class="lado">
      <nav>
        <button class=${!etq ? "on" : ""} onClick=${() => ir("endpoints")}><span>Todos</span><span>${EPS.length}</span></button>
        ${etiquetas.map((t) => html`<button class=${etq === t ? "on" : ""} onClick=${() => ir("endpoints?etiqueta=" + encodeURIComponent(t))}><span>${t}</span><span>${EPS.filter((e) => (e.etiqueta || "Otros") === t).length}</span></button>`)}
      </nav>
      <div class="card" style="padding:6px 10px;overflow-x:auto">
        <table class="tabla">
          <thead><tr><th>Método</th><th>Endpoint</th><th>Descripción</th><th>Frontend</th><th>Auth</th><th></th></tr></thead>
          <tbody>${lista.map((e) => html`<tr class="click" onClick=${() => ir(hEp(e.id))}>
            <td><${Metodo} m=${e.metodo} /></td>
            <td class="ruta-cel">${e.ruta}</td>
            <td>${e.resumen}</td>
            <td>${e.frontend.length ? html`<span class="muted">${e.pantallas.map((p) => base(p).replace(/\.\w+$/, "")).join(", ") || base(e.clientes[0])}</span>` : html`<span class="sin-uso">sin uso</span>`}</td>
            <td title=${e.auth ? "Requiere " + e.auth : "Público"}>${e.auth ? html`<${Ic} n="lock" s=${14} />` : html`<span style="color:var(--media)"><${Ic} n="abierto" s=${14} /></span>`}</td>
            <td>${e.hall.length > 0 && html`<span class=${"sev " + peorSev(e.hall)}>${e.hall.length}</span>`}</td>
          </tr>`)}</tbody>
        </table>
        ${!lista.length && html`<p class="vacio" style="padding:10px">Ningún endpoint coincide con los filtros.</p>`}
      </div>
    </div>
  </div>`;
}

function capaPaso(p) {
  if (p.tabla) return { nac: "db", capa: "Base de datos" };
  return { nac: nacionDe(p.archivo), capa: CAPA_TXT[capaDe(p.archivo)] || capaDe(p.archivo) || "Código" };
}

function EndpointDetalle({ id, tab, q }) {
  const e = EP.get(id);
  if (!e) return html`<div class="pagina"><p class="vacio">No existe el endpoint ${id}.</p></div>`;
  const tabs = [["recorrido", "Recorrido paso a paso"], ["resumen", "Resumen"], ["archivos", `Archivos (${uniq(e.pasos.filter((p) => p.archivo).map((p) => p.archivo)).length})`], ["hallazgos", `Hallazgos (${e.hall.length})`]];
  return html`<div class="pagina">
    <a class="volver" href=${href(FOCO ? "foco" : "endpoints")}><${Ic} n="atras" s=${14} /> ${FOCO ? "Antes de tocarlo" : "Endpoints"}</a>
    <div class="ep-cab"><${Metodo} m=${e.metodo} grande /><h1>${e.ruta}</h1></div>
    <p style="margin:8px 0 10px">${e.resumen}</p>
    <div class="chips"><${Auth} e=${e} />${e.etiqueta && html`<span class="chip">${e.etiqueta}</span>`}${!e.frontend.length && html`<span class="sin-uso">ninguna pantalla lo usa</span>`}${e.hall.length > 0 && html`<span class=${"sev " + peorSev(e.hall)}>${e.hall.length} hallazgo${e.hall.length > 1 ? "s" : ""}</span>`}
      <button class="btn" onClick=${() => copiar(contextoFix(e))}><${Ic} n="copiar" s=${13} /> Copiar contexto para un fix</button></div>
    <nav class="subtabs">${tabs.map(([t, n]) => html`<a class=${tab === t ? "activa" : ""} href=${href(hEp(id, t))}>${n}</a>`)}</nav>
    ${tab === "recorrido" && html`<${Recorrido} e=${e} paso=${parseInt(q.get("paso") || "0", 10) || 0} />`}
    ${tab === "resumen" && html`<${EndpointResumen} e=${e} />`}
    ${tab === "archivos" && html`<${EndpointArchivos} e=${e} />`}
    ${tab === "hallazgos" && (e.hall.length ? e.hall.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} abierto />`) : html`<p class="vacio">Sin hallazgos en este endpoint.</p>`)}
  </div>`;
}

function Recorrido({ e, paso }) {
  const pasos = e.pasos;
  const i = Math.min(Math.max(0, paso), pasos.length - 1);
  const p = pasos[i];
  const irPaso = (n) => ir(hEp(e.id, "recorrido", n));
  useEffect(() => {
    const k = (ev) => {
      if (ev.target.matches("input, textarea, select")) return;
      if (ev.key === "ArrowRight" && i < pasos.length - 1) irPaso(i + 1);
      if (ev.key === "ArrowLeft" && i > 0) irPaso(i - 1);
    };
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, [i, e.id]);
  if (!p) return html`<p class="vacio">Este endpoint no tiene recorrido cargado.</p>`;
  const { nac, capa } = capaPaso(p);
  const hs = p.archivo ? hallDeRango(p.archivo, p.desde, p.hasta) : [];
  const t = p.tabla && TB.get(p.tabla);
  return html`<div>
    <div class="stepper">
      ${pasos.map((s, j) => { const c = capaPaso(s); const alerta = s.archivo && hallDeRango(s.archivo, s.desde, s.hasta).length; return html`
        ${j > 0 && html`<div class="sep"><${Ic} n="flecha" s=${16} /></div>`}
        <button class=${`paso nac-${c.nac}` + (j === i ? " on" : j < i ? " hecho" : "")} onClick=${() => irPaso(j)} aria-current=${j === i ? "step" : undefined}>
          <span class="n">${j + 1}</span><span class="capa">${c.capa}</span>
          ${alerta ? html`<span class="alerta punto ${peorSev(hallDeRango(s.archivo, s.desde, s.hasta))}"></span>` : null}
          <span class="que">${s.accion}</span>
          <span class="arch">${s.tabla ? "tabla " + s.tabla : base(s.archivo) + ":" + s.desde}</span>
        </button>`; })}
    </div>
    <div class="card paso-det" style="margin-top:6px">
      <div class="chips"><${ChipNac} n=${nac} /><span class="chip">${capa}</span><span class="muted" style="font-size:12px">Paso ${i + 1} de ${pasos.length}</span></div>
      <div class="accion" style="margin-top:8px">${p.accion}</div>
      ${p.explicacion && html`<p style="margin:6px 0 0">${p.explicacion}</p>`}
      ${p.pregunta && html`<div class="pregunta"><b>Para pensar</b>${p.pregunta}</div>`}
      ${hs.map((h) => html`<${TarjetaHallazgo} key=${h.id} h=${h} compacto />`)}
      ${p.archivo && html`<${Codigo} key=${p.archivo + p.desde} archivo=${p.archivo} desde=${p.desde} hasta=${p.hasta} />`}
      ${t && html`<div style="margin-top:10px">
        <div class="chips"><span class="op">${p.op}</span><a class="mono" href=${href(hTabla(t.nombre))}>${t.nombre}</a><span class="muted">${t.resumen}</span></div>
        <table class="tabla" style="margin-top:8px"><tbody>${t.campos.map((c) => html`<tr><td class="mono">${c.nombre}</td><td class="muted mono">${c.tipo}</td><td>${c.desc}</td></tr>`)}</tbody></table>
      </div>`}
      <div class="paso-nav">
        <button class="btn" disabled=${i === 0} onClick=${() => irPaso(i - 1)}><${Ic} n="atras" s=${14} /> Anterior</button>
        <span class="muted" style="font-size:12px">← → para avanzar</span>
        <button class="btn primario" disabled=${i === pasos.length - 1} onClick=${() => irPaso(i + 1)}>Siguiente <${Ic} n="flecha" s=${14} /></button>
      </div>
    </div>
  </div>`;
}

function EndpointResumen({ e }) {
  return html`<div class="grid dos">
    <div>
      <div class="card">
        <h3>Qué hace</h3>
        <p style="margin:0 0 14px">${e.explicacion}</p>
        <dl class="info">
          <dt>Método</dt><dd><${Metodo} m=${e.metodo} /></dd>
          <dt>Ruta</dt><dd class="mono">${e.ruta}</dd>
          <dt>Etiqueta</dt><dd>${e.etiqueta || "—"}</dd>
          <dt>Autenticación</dt><dd>${e.auth ? "Requiere " + e.auth : html`<span style="color:var(--media)">Pública</span>`}</dd>
        </dl>
      </div>
      ${e.entrada && html`<div class="card" style="margin-top:16px"><h3>Datos de entrada</h3><${Codigo} archivo=${e.entrada.archivo} desde=${e.entrada.desde} hasta=${e.entrada.hasta} contexto=${0} /></div>`}
    </div>
    <div>
      <div class="card"><h3>Dónde participa</h3><${Participa} e=${e} /></div>
      ${e.respuestas?.length > 0 && html`<div class="card" style="margin-top:16px"><h3>Respuestas posibles</h3>
        <ul class="respuestas">${e.respuestas.map((r) => html`<li><span class=${"codigo-http c" + String(r.codigo)[0]}>${r.codigo}</span><span>${r.desc}</span></li>`)}</ul></div>`}
    </div>
  </div>`;
}

function EndpointArchivos({ e }) {
  const filas = [];
  const visto = new Set();
  for (const p of [...e.frontend, ...e.pasos]) {
    if (!p.archivo || visto.has(p.archivo + p.desde)) continue;
    visto.add(p.archivo + p.desde);
    filas.push(p);
  }
  return html`<div class="card" style="padding:6px 10px;overflow-x:auto"><table class="tabla">
    <thead><tr><th>Archivo</th><th>Nación</th><th>Rol</th><th>Líneas</th></tr></thead>
    <tbody>${filas.map((p) => html`<tr class="click" onClick=${() => ir(hArch(p.archivo, p.desde))}>

// ───────────────────────── Archivos ─────────────────────────
function Archivos({ ruta, q }) {
  const todos = ARCHIVOS();
  const actual = ruta && todos.includes(ruta) ? ruta : null;
  const linea = parseInt(q.get("l") || "0", 10) || null;
  const porNac = {};
  for (const p of todos) (porNac[nacionDe(p)] ||= []).push(p);
  const orden = ["frontend", "backend", "db", "infra"].filter((n) => porNac[n]);
  const ref = actual ? epsDeArchivo(actual) : [];
  const hs = actual ? hallDeArchivo(actual) : [];
  const sim = actual && linea ? [...EPS.flatMap((e) => [...e.frontend, ...e.pasos]), ...HALL].find((r) => r.archivo === actual && r.desde === linea) : null;
  return html`<div class="pagina">
    <div class="pagina-titulo"><div><h1>Archivos</h1><p>Qué hace cada archivo y en qué endpoints participa.</p></div></div>
    <div class="lado" style="grid-template-columns:280px minmax(0,1fr)">
      <div class="card arbol" style="padding:10px">
        ${orden.map((n) => {
          const dirs = {};
          for (const p of porNac[n]) (dirs[p.split("/").slice(0, -1).join("/") || "."] ||= []).push(p);

          <${Codigo} key=${actual + linea} archivo=${actual} desde=${linea || undefined} hasta=${sim?.hasta || linea || undefined} completo />`}

// ───────────────────────── Foco: un solo endpoint ─────────────────────────
function contextoFix(e) {
  const l = [`Quiero hacer un cambio chico en ${A.proyecto?.nombre || "este repo"}, en el endpoint ${e.id}.`, "", "Recorrido actual:"];
  e.pasos.forEach((p, i) => l.push(p.tabla
    ? `${i + 1}. tabla ${p.tabla} (${p.op}): ${p.accion}`
    : `${i + 1}. ${p.archivo}:${p.desde}-${p.hasta}${p.simbolo ? " " + p.simbolo + "()" : ""}: ${p.accion}`));
  if (e.tbs.length) l.push("", "Tablas: " + e.tbs.map((t) => `${t} (${opsDe(e, t).join(", ")})`).join(", "));
  const imp = (FOCO?.impacto || []).filter((x) => x.endpoints.length);
  if (imp.length) l.push("", "Piezas que comparte con otras rutas:", ...imp.map((x) => `- ${x.simbolo}() también la usan ${x.endpoints.join(", ")}`));
  const hs = FOCO ? HALL : e.hall;
  if (hs.length) l.push("", "Problemas conocidos en este camino:", ...hs.map((h) => `- [${h.severidad}] ${h.titulo} (${h.archivo}:${h.desde})`));
  if (e.tests && !e.tests.length) l.push("", "Ningún test cubre este endpoint.");
  l.push("", "Lo que quiero cambiar: <describilo acá>", "",
    "Antes de editar, leé esos archivos, decime qué tocarías y qué podría romperse, y escribí primero un test que reproduzca el problema.");
  return l.join("\n");
}

const INDICE = () => [
  ...EPS.map((e) => ({ t: `${e.metodo} ${e.ruta}`, s: e.resumen, tipo: "Endpoint", h: hEp(e.id), m: e.metodo })),
  ...TABLAS.map((t) => ({ t: t.nombre, s: t.resumen, tipo: "Tabla", h: hTabla(t.nombre) })),
  ...ARCHIVOS().map((p) => ({ t: p, s: ARCH[p]?.rol || "", tipo: "Archivo", h: hArch(p) })),
  ...HALL.map((h) => ({ t: h.titulo, s: h.categoria + " " + h.explicacion, tipo: "Hallazgo", h: hHall(h.id) })),
];

function Buscador() {
  const [q, setQ] = useState("");
  const [i, setI] = useState(0);
  const ref = useRef();
  useEffect(() => {
    const k = (e) => { if (e.key === "/" && !e.target.matches("input, textarea")) { e.preventDefault(); ref.current?.focus(); } };
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, []);
  const res = q.trim() ? INDICE().filter((x) => (x.t + " " + x.s).toLowerCase().includes(q.toLowerCase())).slice(0, 12) : [];
  const elegir = (x) => { ir(x.h); setQ(""); ref.current?.blur(); };
  return html`<div class="buscador">
    <${Ic} n="buscar" s=${15} />
    <input ref=${ref} placeholder="Buscar  ( / )" value=${q} aria-label="Buscar endpoints, tablas, archivos o hallazgos"
      onInput=${(e) => { setQ(e.target.value); setI(0); }}
      onKeyDown=${(e) => { if (e.key === "ArrowDown") { e.preventDefault(); setI(Math.min(i + 1, res.length - 1)); } if (e.key === "ArrowUp") { e.preventDefault(); setI(Math.max(i - 1, 0)); } if (e.key === "Enter" && res[i]) elegir(res[i]); if (e.key === "Escape") { setQ(""); e.target.blur(); } }} />
    ${res.length > 0 && html`<div class="resultados">${res.map((x, j) => html`<button class=${j === i ? "on" : ""} onMouseDown=${(e) => { e.preventDefault(); elegir(x); }}>
      ${x.m ? html`<${Metodo} m=${x.m} />` : null}<span class=${x.tipo === "Archivo" || x.tipo === "Tabla" ? "mono" : ""} style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.m ? x.t.slice(x.m.length + 1) : x.t}</span><span class="tipo">${x.tipo}</span></button>`)}</div>`}
  </div>`;
}

function cambiarTema() {
  const r = document.documentElement;
  const oscuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = oscuro ? "light" : "dark";
  try { localStorage.setItem("atlas-tema", r.dataset.theme); } catch {}
}

    </header>
    <main style=${vista === "mapa" ? "overflow:hidden" : ""}>${cuerpo}</main>
    ${toast && html`<div class="toast" role="status">${toast}</div>`}`;
}

document.title = "Atlify · " + (A.proyecto?.nombre || "código");
render(html`<${App} />`, document.getElementById("app"));
})();
</script>
</body>
</html>
